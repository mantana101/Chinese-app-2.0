<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="author" content="Шамсиддин">
<title>汉语学习 — Учим китайский язык</title>
<meta name="description" content="Программа для изучения китайского языка: уроки, карточки, тоны, пропись иероглифов, чтение, статистика и панель учителя.">
<style>
/* ============================================================
   汉语学习 — стили
   ============================================================ */
:root {
  --bg: #12100e;
  --bg2: #1b1815;
  --panel: #201c18;
  --panel2: #272220;
  --line: #38302a;
  --txt: #f2ece4;
  --txt2: #b6a89a;
  --txt3: #7d7166;
  --red: #d0453a;
  --red2: #e8615a;
  --gold: #e0b354;
  --jade: #5aa88f;
  --blue: #6a9fd4;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"] {
  --bg: #f4efe6;
  --bg2: #ede5d8;
  --panel: #fffdf8;
  --panel2: #f7f2e8;
  --line: #ddd2c2;
  --txt: #231c15;
  --txt2: #5b4d3f;
  --txt3: #8c7b6a;
  --red: #b83328;
  --red2: #d0453a;
  --gold: #9a6912;
  --jade: #2b7b63;
  --blue: #366da3;
  --shadow: 0 8px 24px rgba(45,30,15,.08);
}
:root[data-theme="light"] #nav { background: rgba(255,253,248,.94); }
:root[data-theme="light"] .mnav { background: rgba(255,253,248,.97); }
:root[data-theme="light"] .hero { background: linear-gradient(135deg, #fffaf0, #f5ead8); }
:root[data-theme="light"] .vcard .vc-h, :root[data-theme="light"] .gram-ex b,
:root[data-theme="light"] .gl-row b, :root[data-theme="light"] .rt-v { color: var(--red); }
:root[data-theme="light"] .tile:hover, :root[data-theme="light"] .opt:hover:not(:disabled) { background: rgba(154,105,18,.08); }
:root[data-theme="light"] .search, :root[data-theme="light"] .auth-form input,
:root[data-theme="light"] .g-input, :root[data-theme="light"] .gap-input { background: #fff; color: var(--txt); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(208,69,58,.16), transparent 60%),
    radial-gradient(900px 500px at 0% 0%, rgba(224,179,84,.10), transparent 55%),
    var(--bg);
  color: var(--txt);
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}
.zh, .vcard .vc-h, .fc-hanzi, .w-h, .d-h, .ph-h, .dict-row .d-h, .tt-s, .tc-s, .wi-h {
  font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "PingFang SC", "Microsoft YaHei", serif;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* ---------- Каркас ---------- */
.app { display: flex; min-height: 100vh; }
#nav {
  width: 232px; flex: 0 0 232px; background: rgba(20,17,15,.85);
  border-right: 1px solid var(--line); padding: 18px 12px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 11px; flex: 0 0 40px;
  background: linear-gradient(140deg, var(--red), #8e2b23);
  display: grid; place-items: center; font-size: 23px;
  font-family: "Noto Serif SC", serif; color: #fff5e8;
  box-shadow: 0 6px 18px rgba(208,69,58,.35);
}
.brand-t { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
.brand-s { font-size: 11px; color: var(--txt3); }
#nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px;
  color: var(--txt2); font-size: 14px; margin-bottom: 2px; transition: .15s;
}
#nav a:hover { background: rgba(255,255,255,.045); color: var(--txt); }
#nav a.active { background: linear-gradient(90deg, rgba(208,69,58,.22), rgba(208,69,58,.05)); color: #fff; font-weight: 600; }
#nav a.active .ni { transform: scale(1.1); }
.ni { font-size: 17px; width: 22px; text-align: center; transition: .15s; }
.nav-foot { margin-top: 20px; padding: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--txt3); }
.nav-foot b { color: var(--gold); }

#main { flex: 1; min-width: 0; }
#view { padding: 30px 34px 60px; max-width: 1120px; }

/* ---------- Заголовки ---------- */
.page-title { font-size: 27px; margin: 0 0 4px; font-weight: 700; letter-spacing: -.3px; }
.page-sub { color: var(--txt2); margin: 0 0 22px; font-size: 14px; max-width: 720px; }

/* ---------- Кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  padding: 9px 16px; border-radius: 10px; border: 1px solid transparent;
  background: var(--panel2); color: var(--txt); font-size: 14px; font-weight: 500;
  transition: .15s; border-color: var(--line);
}
.btn:hover { transform: translateY(-1px); border-color: #524640; }
.btn-primary { background: linear-gradient(135deg, var(--red2), var(--red)); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(208,69,58,.28); }
.btn-primary:hover { box-shadow: 0 9px 24px rgba(208,69,58,.4); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--txt2); }
.btn-ghost:hover { color: var(--txt); }
.btn-sm { padding: 5px 11px; font-size: 12.5px; border-radius: 8px; }
.btn-danger { background: transparent; border-color: #6b2f2a; color: #e08076; }
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
.pill { background: var(--gold); color: #20180c; border-radius: 20px; padding: 1px 8px; font-size: 12px; font-weight: 700; }

.speak {
  background: rgba(90,168,143,.14); border: 1px solid rgba(90,168,143,.35); color: #7fd0b4;
  border-radius: 8px; width: 30px; height: 30px; font-size: 14px; display: inline-grid; place-items: center;
  transition: .15s; flex: 0 0 auto;
}
.speak:hover { background: rgba(90,168,143,.28); }
.speak.sm { width: 26px; height: 26px; font-size: 12px; }
.speak.big { width: 42px; height: 42px; font-size: 18px; }

/* ---------- Панели ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow);
}
.panel h3 { margin: 0 0 14px; font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.panel-head h3 { margin: 0; }
.note { background: rgba(224,179,84,.08); border-left: 3px solid var(--gold); padding: 10px 13px; border-radius: 0 8px 8px 0; color: var(--txt2); font-size: 13.5px; margin-top: 12px; }
.empty { color: var(--txt3); font-style: italic; padding: 12px 0; }
.level-chip { background: rgba(106,159,212,.16); color: #93c1ec; border: 1px solid rgba(106,159,212,.3); border-radius: 20px; padding: 2px 10px; font-size: 11.5px; margin-left: 8px; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 22px; padding: 34px 36px;
  background:
    radial-gradient(600px 260px at 90% 10%, rgba(224,179,84,.14), transparent 65%),
    linear-gradient(125deg, #2b1613 0%, #231d19 48%, #181411 100%);
  border: 1px solid rgba(224,179,84,.28); margin-bottom: 22px; display: flex; align-items: center; gap: 30px;
  box-shadow: 0 18px 44px rgba(0,0,0,.42);
}
.hero-bg {
  position: absolute; right: -10px; top: -40px; font-size: 260px; opacity: .05;
  font-family: "Noto Serif SC", serif; color: var(--gold); pointer-events: none; line-height: 1;
}
.hero-seal {
  position: absolute; right: 20px; top: 18px; width: 42px; height: 42px; border-radius: 8px;
  border: 2px solid rgba(208,69,58,.65); color: #ff8e84; background: rgba(208,69,58,.14);
  font-family: "Noto Serif SC", serif; font-size: 13px; line-height: 1.15; font-weight: 700;
  display: grid; place-items: center; text-align: center; transform: rotate(-6deg); pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; flex: 1; }
.hero-tag { color: var(--gold); font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; margin-bottom: 8px; }
.hero h1 { margin: 0 0 6px; font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
.hero-sub { color: var(--txt2); margin: 0 0 20px; font-size: 15px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.hero-stats { display: flex; gap: 30px; flex-wrap: wrap; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats b { font-size: 21px; color: var(--txt); }
.hero-stats span { font-size: 11.5px; color: var(--txt3); text-transform: uppercase; letter-spacing: .8px; }
.progress-ring {
  width: 132px; height: 132px; flex: 0 0 132px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255,255,255,.07) 0);
  position: relative; box-shadow: 0 0 28px rgba(224,179,84,.18);
}
.progress-ring::before { content: ''; position: absolute; inset: 11px; border-radius: 50%; background: var(--bg2); }
.progress-ring div { position: relative; z-index: 1; font-size: 24px; font-weight: 700; }

/* ---------- Плитки ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile {
  display: flex; align-items: center; gap: 13px; padding: 15px 17px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); transition: .18s;
}
.tile:hover { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 8px 20px rgba(0,0,0,.22); }
.tile-ic { font-size: 23px; width: 40px; height: 40px; display: grid; place-items: center; background: rgba(255,255,255,.045); border-radius: 10px; flex: 0 0 40px; }
.tile b { display: block; font-size: 14.5px; }
.tile span { font-size: 12px; color: var(--txt3); }
.tile-hot { border-color: rgba(224,179,84,.5); }

/* ---------- План ---------- */
.module-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.module-head h3 { margin: 2px 0 4px; }
.module-head p { margin: 0; color: var(--txt3); font-size: 13px; }
.module-level { color: var(--gold); font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; }
.lesson-list { display: flex; flex-direction: column; gap: 7px; }
.lesson-row {
  display: flex; align-items: center; gap: 13px; padding: 11px 14px; border-radius: 11px;
  background: rgba(255,255,255,.028); border: 1px solid transparent; transition: .15s;
}
.lesson-row:hover { background: rgba(208,69,58,.1); border-color: rgba(208,69,58,.3); }
.lesson-row.done { background: rgba(90,168,143,.07); }
.lr-num {
  width: 27px; height: 27px; flex: 0 0 27px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600;
}
.lesson-row.done .lr-num { background: var(--jade); color: #0d2a22; }
.lr-body { flex: 1; display: flex; flex-direction: column; }
.lr-body b { font-size: 14px; }
.lr-body span { font-size: 12px; color: var(--txt3); }
.lr-score { color: var(--jade); font-size: 13px; font-weight: 600; }
.lr-go { color: var(--txt3); }

/* ---------- Урок ---------- */
.lesson-head { margin-bottom: 20px; }
.lh-badge { color: var(--gold); font-size: 11.5px; letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 7px; }
.lesson-head h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.4px; }
.lh-sub { color: var(--txt2); margin: 0; }
.goals { border-left: 3px solid var(--gold); }
.goal { color: var(--txt2); font-size: 14px; padding: 3px 0; }

.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.vcard {
  background: rgba(255,255,255,.032); border: 1px solid var(--line); border-radius: 11px;
  padding: 12px 13px; position: relative; transition: .15s;
}
.vcard:hover { border-color: rgba(224,179,84,.45); background: rgba(255,255,255,.055); }
.vc-h { font-size: 22px; margin-bottom: 2px; letter-spacing: 1px; }
.vc-p { color: var(--gold); font-size: 12.5px; margin-bottom: 4px; }
.vc-r { color: var(--txt2); font-size: 12.5px; }
.vc-tools { position: absolute; top: 9px; right: 9px; display: flex; gap: 4px; }
.add-card {
  width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.05);
  color: var(--txt3); font-size: 13px; display: grid; place-items: center; transition: .15s;
}
.add-card:hover { color: var(--gold); border-color: var(--gold); }
.add-card.added { color: var(--jade); border-color: var(--jade); }

.gram { padding: 13px 0; border-bottom: 1px dashed rgba(255,255,255,.07); }
.gram:last-child { border-bottom: none; }
.gram-t { font-weight: 650; font-size: 14.5px; margin-bottom: 5px; color: #ffd9d3; }
.gram-b { color: var(--txt2); font-size: 13.8px; }
.gram-b b { color: var(--gold); font-weight: 600; }

/* ---------- Квиз ---------- */
.q-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; color: var(--txt3); font-size: 12.5px; }
.q-bar { flex: 1; height: 5px; background: rgba(255,255,255,.07); border-radius: 4px; overflow: hidden; }
.q-bar div { height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); transition: .3s; }
.q-text { font-size: 17px; font-weight: 600; margin-bottom: 15px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 14px;
  background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 10px;
  color: var(--txt); font-size: 14.5px; transition: .14s; width: 100%;
}
.opt:hover:not(:disabled) { background: rgba(255,255,255,.07); border-color: var(--gold); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt-k { width: 23px; height: 23px; flex: 0 0 23px; border-radius: 6px; background: rgba(255,255,255,.07); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--txt2); }
.opt.right { border-color: var(--jade); background: rgba(90,168,143,.14); }
.opt.right .opt-k { background: var(--jade); color: #0d2a22; }
.opt.wrong { border-color: var(--red); background: rgba(208,69,58,.14); }
.opt.wrong .opt-k { background: var(--red); color: #fff; }
.gap-row { display: flex; gap: 9px; }
.gap-input {
  flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(0,0,0,.25); color: var(--txt); font-size: 16px; font-family: "Noto Serif SC", serif;
}
.gap-input:focus { outline: none; border-color: var(--gold); }
.gap-input.right { border-color: var(--jade); background: rgba(90,168,143,.1); }
.gap-input.wrong { border-color: var(--red); background: rgba(208,69,58,.1); }
.order-line {
  min-height: 50px; background: rgba(0,0,0,.22); border: 1px dashed var(--line); border-radius: 10px;
  padding: 10px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 12px;
}
.order-pool { display: flex; flex-wrap: wrap; gap: 7px; }
.ow {
  padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.05);
  color: var(--txt); font-size: 15px; font-family: "Noto Serif SC", serif; transition: .14s;
}
.ow:hover { border-color: var(--gold); }
.ow.used { opacity: .28; pointer-events: none; }
.ow.used-inline { background: rgba(224,179,84,.16); border-color: var(--gold); color: #ffedcb; }
.q-controls-inline { display: flex; gap: 8px; margin-top: 13px; }
.q-feedback { display: none; margin-top: 14px; padding: 11px 14px; border-radius: 10px; font-size: 14px; }
.q-feedback.ok { background: rgba(90,168,143,.12); border-left: 3px solid var(--jade); color: #a9e0cd; }
.q-feedback.bad { background: rgba(208,69,58,.12); border-left: 3px solid var(--red); color: #f0b5af; }
.q-feedback b { color: var(--gold); }
.q-controls { margin-top: 13px; }
.listen-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; color: var(--txt3); font-size: 12.5px; }
.quiz-done { text-align: center; padding: 22px 10px; }
.qd-emoji { font-size: 46px; margin-bottom: 6px; }
.quiz-done h3 { justify-content: center; font-size: 19px; }
.quiz-done p { color: var(--txt2); margin: 0 0 18px; }
.qd-actions { display: flex; gap: 10px; justify-content: center; }
.hw-item { color: var(--txt2); padding: 5px 0; font-size: 14px; }
.hw-note { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--txt3); font-size: 12.5px; font-style: italic; }
.nav-lessons { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }

/* ---------- Карточки ---------- */
.srs-stats { display: flex; gap: 30px; margin-bottom: 16px; flex-wrap: wrap; }
.srs-stats div { display: flex; flex-direction: column; }
.srs-stats b { font-size: 22px; }
.srs-stats span { font-size: 11.5px; color: var(--txt3); text-transform: uppercase; letter-spacing: .8px; }
.flashcard {
  background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--line);
  border-radius: 18px; padding: 30px; text-align: center; margin-bottom: 16px; box-shadow: var(--shadow);
  cursor: pointer; user-select: none;
}
.flashcard.fc-3d {
  background: transparent; border: none; padding: 0; box-shadow: none; perspective: 1100px;
}
.fc-inner {
  display: grid; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.22,.61,.36,1);
}
.fc-inner.flipped { transform: rotateY(180deg); }
.fc-face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--line);
  border-radius: 18px; padding: 28px 24px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 270px;
}
.fc-back { transform: rotateY(180deg); border-color: rgba(224,179,84,.45); }
.fc-progress { color: var(--txt3); font-size: 12px; margin-bottom: 14px; }
.fc-hanzi { font-size: 62px; line-height: 1.15; letter-spacing: 3px; }
.fc-hanzi.sm { font-size: 40px; }
.fc-pinyin { color: var(--gold); font-size: 17px; margin-bottom: 12px; }
.fc-reveal { margin-top: 8px; color: var(--txt); font-size: 19px; }
.fc-tip { color: var(--txt3); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.fc-show { margin-top: 10px; }
.fc-speak-row { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--txt3); font-size: 12.5px; }
.fc-actions { display: flex; gap: 12px; justify-content: center; min-height: 46px; margin-bottom: 10px; }
.fc-actions .btn { min-width: 150px; padding: 12px 20px; font-size: 15px; }
.custom-card-form {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
}
.cc-in {
  padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line);
  background: rgba(0,0,0,.22); color: var(--txt); font-size: 13.5px; min-width: 130px; flex: 1;
}
.cc-in.wide { flex: 1.6; min-width: 170px; }
.cc-in:focus { outline: none; border-color: var(--gold); }
:root[data-theme="light"] .cc-in { background: #fff; color: var(--txt); }
.card-list { display: flex; flex-direction: column; gap: 5px; max-height: 430px; overflow-y: auto; }
.cl-row { display: grid; grid-template-columns: 110px 120px 1fr 110px 30px; gap: 10px; align-items: center; padding: 8px 11px; border-radius: 8px; background: rgba(255,255,255,.028); font-size: 13.5px; }
.cl-h { font-family: "Noto Serif SC", serif; font-size: 17px; }
.cl-p { color: var(--gold); font-size: 12.5px; }
.cl-r { color: var(--txt2); }
.cl-box { color: var(--jade); font-size: 11px; letter-spacing: 1px; }
.cl-box i { color: var(--txt3); font-style: normal; }
.cl-del { background: none; border: none; color: var(--txt3); font-size: 13px; }
.cl-del:hover { color: var(--red); }

/* ---------- Тоны ---------- */
.tabs { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; }
.tab { padding: 8px 15px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--txt2); font-size: 13.5px; transition: .15s; }
.tab:hover { color: var(--txt); border-color: var(--gold); }
.tab.active { background: linear-gradient(135deg, var(--red2), var(--red)); color: #fff; border-color: transparent; font-weight: 600; }
.tone-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px; }
.tone-cell { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 11px; padding: 15px; text-align: center; }
.tc-s { font-size: 38px; color: var(--gold); line-height: 1.1; }
.tc-n { color: var(--txt2); font-size: 12.5px; margin-bottom: 2px; }
.tc-r { color: var(--txt3); font-size: 12px; margin-bottom: 10px; }
.tone-table { display: flex; flex-direction: column; gap: 4px; }
.tt-row { display: grid; grid-template-columns: 60px 34px 110px 1fr 32px 40px; gap: 10px; align-items: center; padding: 7px 11px; border-radius: 8px; background: rgba(255,255,255,.028); font-size: 13.5px; }
.tt-s { font-size: 19px; color: var(--gold); }
.tt-n { color: var(--txt3); }
.tt-ex { font-family: "Noto Serif SC", serif; }
.tt-r { color: var(--txt2); }
.rule-table { display: flex; flex-direction: column; gap: 6px; }
.rt-row { display: grid; grid-template-columns: 110px 150px 1fr; gap: 13px; padding: 10px 12px; border-radius: 9px; background: rgba(255,255,255,.028); align-items: baseline; font-size: 13.5px; }
.rt-row b { color: var(--gold); font-size: 15px; }
.rt-v { font-family: "Noto Serif SC", serif; color: #ffd9d3; }
.rt-b { color: var(--txt2); }
.tone-quiz { text-align: center; }
.tq-info { color: var(--txt3); font-size: 12.5px; margin-bottom: 12px; }
.tq-syl { font-size: 62px; font-family: "Noto Serif SC", serif; color: var(--gold); line-height: 1.2; margin-bottom: 8px; }
.tone-opts { display: flex; gap: 11px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
.tone-opt { width: 66px; height: 66px; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.04); color: var(--txt); font-size: 25px; font-weight: 700; transition: .15s; }
.tone-opt:hover:not(:disabled) { border-color: var(--gold); transform: scale(1.06); }
.tone-opt.right { background: var(--jade); border-color: var(--jade); color: #0d2a22; }
.tone-opt.wrong { background: var(--red); border-color: var(--red); color: #fff; }
.tq-ans { color: var(--txt3); font-size: 13px; }

/* ---------- Пропись ---------- */
.write-panel { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
.write-info { text-align: center; min-width: 160px; }
.wi-h { font-size: 56px; color: var(--gold); line-height: 1.1; }
.wi-p { color: var(--txt2); font-size: 14px; }
.wi-r { color: var(--txt2); font-size: 13.5px; margin-bottom: 6px; }
.wi-s { color: var(--txt3); font-size: 12px; }
.write-box { flex: 1; min-width: 260px; display: flex; justify-content: center; }
.wcanvas { border-radius: 10px; cursor: crosshair; touch-action: none; box-shadow: var(--shadow); max-width: 100%; }
.write-ctr { display: flex; gap: 8px; justify-content: center; width: 100%; }
.write-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.ws-item { width: 42px; height: 42px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--txt); font-size: 21px; font-family: "Noto Serif SC", serif; transition: .14s; }
.ws-item:hover { border-color: var(--gold); }
.ws-item.active { background: rgba(224,179,84,.18); border-color: var(--gold); color: #ffedcb; }

/* ---------- Чтение ---------- */
.text-body { display: flex; flex-direction: column; gap: 11px; }
.text-line { padding: 11px 14px; border-radius: 10px; background: rgba(255,255,255,.03); cursor: pointer; transition: .15s; border: 1px solid transparent; }
.text-line:hover { background: rgba(208,69,58,.1); border-color: rgba(208,69,58,.25); }
.w { display: inline-flex; flex-direction: column; align-items: center; margin-right: 3px; vertical-align: bottom; }
.w-h { font-size: 27px; font-family: "Noto Serif SC", serif; line-height: 1.25; }
.w-p { font-size: 11px; color: var(--gold); height: 15px; }
.punct { font-size: 24px; color: var(--txt2); font-family: "Noto Serif SC", serif; }
.gloss { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.gl-row { display: grid; grid-template-columns: 130px 140px 1fr; gap: 11px; padding: 7px 11px; border-radius: 8px; background: rgba(255,255,255,.028); font-size: 13.5px; align-items: baseline; }
.gl-row b { font-family: "Noto Serif SC", serif; font-size: 16px; color: #ffd9d3; }
.gl-p { color: var(--gold); font-size: 12.5px; }
.gl-row span:last-child { color: var(--txt2); }

/* ---------- Фразы ---------- */
.ph-list { display: flex; flex-direction: column; gap: 5px; }
.ph-row { display: grid; grid-template-columns: 160px 150px 1fr 32px; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 9px; background: rgba(255,255,255,.028); font-size: 13.5px; }
.ph-h { font-family: "Noto Serif SC", serif; font-size: 17px; }
.ph-p { color: var(--gold); font-size: 12.5px; }
.ph-r { color: var(--txt2); }

/* ---------- Словарь ---------- */
.search {
  width: 100%; padding: 12px 15px; border-radius: 11px; border: 1px solid var(--line);
  background: rgba(0,0,0,.25); color: var(--txt); font-size: 14.5px; margin-bottom: 10px;
}
.search:focus { outline: none; border-color: var(--gold); }
.dict-count { color: var(--txt3); font-size: 12.5px; margin-bottom: 10px; }
.dict-list { display: flex; flex-direction: column; gap: 4px; max-height: 620px; overflow-y: auto; }
.dict-row { display: grid; grid-template-columns: 140px 160px 1fr 110px 30px; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.028); font-size: 13.5px; }
.d-h { font-size: 18px; }
.d-p { color: var(--gold); font-size: 12.5px; }
.d-r { color: var(--txt2); }
.d-src { color: var(--txt3); font-size: 11.5px; }

/* ---------- Статистика ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-grid div { display: flex; flex-direction: column; }
.stat-grid b { font-size: 26px; }
.stat-grid span { font-size: 11.5px; color: var(--txt3); text-transform: uppercase; letter-spacing: .8px; }
.days { display: flex; gap: 9px; flex-wrap: wrap; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 14px; border-radius: 10px; background: rgba(255,255,255,.03); color: var(--txt3); }
.day i { font-style: normal; font-size: 17px; color: var(--txt3); }
.day.on { background: rgba(90,168,143,.14); color: var(--jade); }
.day.on i { color: var(--jade); }
.day span { font-size: 11px; }
.mini-list { display: flex; flex-direction: column; gap: 4px; }
.mini-row { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.028); font-size: 13.5px; }
.score { font-weight: 700; }
.score.ok { color: var(--jade); }
.score.mid { color: var(--gold); }
.score.bad { color: var(--red2); }

/* ---------- Диагностика ---------- */
.quiz-intro ul.diag-list { margin: 0 0 18px; padding-left: 20px; color: var(--txt2); font-size: 14px; }
.quiz-intro ul.diag-list li { padding: 3px 0; }
.level-badge {
  display: inline-block; background: linear-gradient(135deg, var(--gold), #c4923a); color: #241a08;
  border-radius: 30px; padding: 5px 18px; font-weight: 800; font-size: 14px; letter-spacing: .5px; margin-bottom: 10px;
}
.diag-result {
  max-width: 560px; margin: 6px auto 16px; padding: 13px 17px; border-radius: 11px;
  background: rgba(255,255,255,.04); border-left: 3px solid var(--gold); color: var(--txt2); font-size: 14px; text-align: left;
}
.diag-weak { max-width: 620px; margin: 0 auto 18px; text-align: left; font-size: 13px; color: var(--txt2); }
.diag-weak b { display: block; margin-bottom: 7px; color: var(--txt); }
.weak-chip {
  display: inline-block; background: rgba(208,69,58,.14); border: 1px solid rgba(208,69,58,.32);
  color: #f0b5af; border-radius: 8px; padding: 3px 9px; margin: 3px 4px 3px 0; font-size: 12.5px;
}

/* ---------- Тост ---------- */
.toast {
  position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 24px);
  background: #efe6da; color: #221d18; padding: 10px 20px; border-radius: 11px; font-size: 13.5px;
  font-weight: 600; opacity: 0; pointer-events: none; transition: .22s; z-index: 99; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Нижнее меню (мобильные) ---------- */
.mnav { display: none; }

/* ---------- Экран входа ---------- */
.auth-wrap { max-width: 470px; margin: 4vh auto; }
.auth-card { padding: 26px 26px 22px; }
.auth-head { text-align: center; margin-bottom: 18px; }
.auth-logo {
  width: 62px; height: 62px; margin: 0 auto 12px; border-radius: 18px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--red2), #8e2b23); font-size: 34px; color: #fff5e8;
  font-family: "Noto Serif SC", serif; box-shadow: 0 10px 26px rgba(208,69,58,.35);
}
.auth-head h1 { margin: 0 0 4px; font-size: 25px; letter-spacing: -.3px; }
.auth-head p { margin: 0; color: var(--txt2); font-size: 13.5px; }
.auth-head b { color: var(--gold); }
.auth-warn { background: rgba(224,179,84,.1); border: 1px solid rgba(224,179,84,.3); border-radius: 10px; padding: 10px 13px; font-size: 13px; color: #e8d3a4; margin-bottom: 14px; }
.auth-form { display: flex; flex-direction: column; gap: 11px; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field span { font-size: 12px; color: var(--txt3); text-transform: uppercase; letter-spacing: .7px; }
.field input {
  padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(0,0,0,.25); color: var(--txt); font-size: 15px; font-family: inherit;
}
.field input:focus { outline: none; border-color: var(--gold); }
.auth-error { background: rgba(208,69,58,.13); border-left: 3px solid var(--red); color: #f0b5af; padding: 9px 13px; border-radius: 0 8px 8px 0; font-size: 13.5px; margin-top: 12px; }
.auth-submit { margin-top: 14px; padding: 12px; font-size: 15px; width: 100%; }
.auth-guest { margin-top: 10px; width: 100%; }

/* ---------- Профиль ---------- */
.teacher-only { display: none; }
.profile-head { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
.avatar {
  width: 54px; height: 54px; flex: 0 0 54px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--gold), #b8862c); color: #241a08; font-size: 23px; font-weight: 700;
}
.profile-role { color: var(--txt3); font-size: 13px; }
.profile-rows { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.pr-row { display: flex; justify-content: space-between; padding: 9px 13px; border-radius: 9px; background: rgba(255,255,255,.028); font-size: 13.5px; }
.pr-row span { color: var(--txt2); }
.pr-row b.ok { color: var(--jade); }
.nav-user { margin-bottom: 9px; }.nav-user b { display: block; color: var(--txt); font-size: 13.5px; }
.nav-user span { color: var(--txt3); font-size: 11.5px; }
.nav-foot .btn { width: 100%; }

/* ---------- Панель учителя ---------- */
.code-list { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.code-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(224,179,84,.08); border: 1px solid rgba(224,179,84,.25); }
.code-item b { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 19px; letter-spacing: 2px; color: var(--gold); }
.code-item span { color: var(--txt3); font-size: 11.5px; flex: 1; }
.student-table { display: flex; flex-direction: column; gap: 4px; overflow-x: auto; }
.st-row {
  display: grid; grid-template-columns: minmax(130px, 1.5fr) 70px 62px 72px 62px 52px 96px 76px 84px;
  gap: 9px; align-items: center; padding: 10px 12px; border-radius: 9px; background: rgba(255,255,255,.028);
  font-size: 13px; min-width: 780px;
}
.st-head { background: transparent; color: var(--txt3); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
.st-name b { display: block; font-size: 13.5px; }
.st-name i { color: var(--txt3); font-style: normal; font-size: 11.5px; }
.st-when { color: var(--txt3); font-size: 12px; }
.st-grade { color: var(--gold); font-weight: 700; text-align: center; }
.st-acts { display: flex; gap: 5px; justify-content: flex-end; }
.ok { color: var(--jade); }
.mid { color: var(--gold); }
.bad { color: var(--red2); }

/* ---------- Модальное окно ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(8,6,5,.72); backdrop-filter: blur(3px);
  display: grid; place-items: center; z-index: 50; padding: 20px; overflow-y: auto;
}
.modal { max-width: 620px; width: 100%; max-height: 88vh; overflow-y: auto; margin: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-head h2 { margin: 0; font-size: 20px; }
.modal-x { background: none; border: none; color: var(--txt3); font-size: 18px; cursor: pointer; }
.lvl-chip { font-size: 11px; background: rgba(90,168,143,.15); color: var(--jade); border-radius: 20px; padding: 2px 10px; margin-left: 7px; }
.lesson-bars { display: flex; flex-direction: column; gap: 5px; margin-bottom: 18px; }
.lb { display: grid; grid-template-columns: 150px 1fr 46px; gap: 10px; align-items: center; font-size: 12.5px; }
.lb span { color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-bar { height: 7px; border-radius: 5px; background: rgba(255,255,255,.07); overflow: hidden; }
.lb-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); }
.lb b { text-align: right; color: var(--gold); font-size: 12px; }
.grade-edit { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.g-input { padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--txt); font-size: 14px; }
.g-input.wide { flex: 1; min-width: 200px; }
.g-input:focus { outline: none; border-color: var(--gold); }
.events { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.ev { display: grid; grid-template-columns: 100px 1fr 90px; gap: 9px; padding: 7px 11px; border-radius: 8px; background: rgba(255,255,255,.028); font-size: 12.5px; }
.ev span:first-child { color: var(--gold); }
.ev i { color: var(--txt3); font-style: normal; text-align: right; }
.modal-foot { display: flex; gap: 9px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }

.frame-banner {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; background: rgba(224,179,84,.14); border-bottom: 1px solid rgba(224,179,84,.35);
  color: #ffefc8; font-size: 13px; backdrop-filter: blur(8px);
}
.frame-banner .fb-x {
  background: none; border: none; color: var(--txt2); font-size: 16px; cursor: pointer; padding: 4px 8px;
}
.owner-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding: 15px 18px; border-radius: 14px; margin-bottom: 16px;
  background: rgba(224,179,84,.1); border: 1px solid rgba(224,179,84,.35); font-size: 14px;
}
.sys-errors { display: flex; flex-direction: column; gap: 8px; }
.sys-err { padding: 11px 14px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
.se-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
.se-head b { flex: 1; min-width: 180px; }
.se-head i { color: var(--txt3); font-style: normal; font-size: 12px; }
.se-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
.se-srv { background: rgba(208,69,58,.2); color: #ffb3ac; }
.se-cli { background: rgba(224,179,84,.18); color: var(--gold); }
.se-det { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,.3); color: var(--txt2); font-size: 11.5px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.site-foot {
  max-width: 960px; margin: 28px auto 0; padding: 14px 4px 8px;
  border-top: 1px solid var(--line); color: var(--txt3); font-size: 12.5px; text-align: center;
}
.site-foot b { color: var(--gold); font-weight: 600; }
.nav-quick { display: flex; gap: 6px; margin-top: 8px; }
.nav-quick .btn { flex: 1; padding: 5px 6px; font-size: 11.5px; }
.grade-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 13px 16px; border-radius: 14px; margin-bottom: 16px;
  background: rgba(90,168,143,.12); border: 1px solid rgba(90,168,143,.35); font-size: 14px;
}
.gb-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gb-tag { color: var(--jade); font-weight: 600; }
.gb-val { padding: 2px 10px; border-radius: 20px; background: var(--jade); color: #0b241d; font-size: 14px; }
.gb-cmt { color: var(--txt); }
.grade-box { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.grade-num {
  min-width: 56px; height: 56px; border-radius: 14px; padding: 0 14px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--jade), #3b826c); color: #fff; font-size: 22px; font-weight: 700;
}
.confetti-box {
  position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden;
}
.confetti-box i {
  position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px;
  animation: confetti-fall 2s ease-out forwards;
}
@keyframes confetti-fall {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate3d(var(--dx, 0px), 100vh, 0) rotate(680deg); opacity: 0; }
}

/* ---------- Видео-уроки ---------- */
.vid-player { padding: 0; overflow: hidden; }
.vid-stage {
  position: relative; min-height: 290px; padding: 22px 26px; display: flex; flex-direction: column;
  justify-content: space-between;
  background:
    radial-gradient(500px 260px at 80% 20%, rgba(224,179,84,.14), transparent 65%),
    linear-gradient(155deg, #1b1512, #120f0d);
  color: #f4eee6;
}
.vid-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; }
.vid-badge { padding: 3px 10px; border-radius: 20px; background: rgba(208,69,58,.24); color: #ffb3ac; font-weight: 600; }
.vid-time { color: #a7998c; }
.vid-main { text-align: center; padding: 18px 8px; }
.vid-hanzi { font-family: "Noto Serif SC", serif; font-size: 56px; line-height: 1.15; color: #fff; letter-spacing: 3px; animation: vid-pop .35s ease; }
.vid-pinyin { color: #e0b354; font-size: 20px; margin: 6px 0 10px; font-weight: 600; }
.vid-ru { font-size: 18px; color: #f2ece4; font-weight: 600; }
.vid-sub { margin-top: 8px; font-size: 13.5px; color: #b8aa9b; background: rgba(255,255,255,.06); display: inline-block; padding: 5px 14px; border-radius: 20px; }
.vid-tone-box { display: inline-flex; align-items: center; gap: 10px; margin: 4px 0 8px; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 12.5px; color: #e0b354; }
.vid-tone-svg { width: 78px; height: 38px; }
.vid-bar { height: 5px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
.vid-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); transition: width .3s; }
.vid-ctr { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 18px; background: var(--panel2); border-top: 1px solid var(--line); }
.vid-sec-t { margin: 10px 0 10px; font-size: 15.5px; }
.vid-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.vid-item {
  display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 15px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--txt); transition: .15s;
}
.vid-item:hover { border-color: var(--gold); }
.vid-item.active { border-color: var(--red); background: rgba(208,69,58,.1); }
.vi-num { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: rgba(224,179,84,.16); color: var(--gold); font-weight: 700; flex: 0 0 32px; }
.vi-txt b { display: block; font-size: 14.5px; }
.vi-txt span { font-size: 12.5px; color: var(--txt2); }
.yt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.yt-card {
  display: flex; flex-direction: column; gap: 7px; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel2); transition: .15s;
}
.yt-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.yt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11.5px; color: var(--txt3); }
