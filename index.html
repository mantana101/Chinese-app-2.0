.module:nth-of-type(2) .lr-num { background: rgba(116,169,239,.18); color: var(--blue); }
.module:nth-of-type(3) .lr-num { background: rgba(169,139,240,.2);  color: var(--violet); }
.module:nth-of-type(4) .lr-num { background: rgba(242,141,180,.2);  color: var(--pink); }
.lesson-row.done .lr-num { background: linear-gradient(140deg, var(--jade2), var(--jade)); color: var(--on-accent); }
.module-level { color: var(--violet); }

/* ---------- Панели: тонкая цветная кромка сверху ---------- */
.panel { position: relative; }
/* «Наклеено руками»: панели стоят не идеально, но совсем чуть-чуть.
   Больше поворота — и текст начнёт «плыть», поэтому доли градуса. */
.panel:nth-of-type(odd) { --tilt: -.45deg; }
.panel:nth-of-type(even) { --tilt: .4deg; }
.panel { transform: rotate(var(--tilt, 0deg)); }
.panel > h3::before {
  content: ''; flex: 0 0 3px; width: 3px; height: 16px; border-radius: 1px 2px 2px 1px;
  background: linear-gradient(180deg, var(--red) 10%, var(--gold) 90%);
}

/* ---------- Статистика: цифры цветные ---------- */
.hero-stats b { background: linear-gradient(120deg, var(--gold2), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.srs-stats b { color: var(--gold); }

/* ---------- Прогресс-кольцо: многоцветный закат ---------- */
.progress-ring {
  background: conic-gradient(from -90deg,
    var(--gold2) 0%,
    var(--red2) calc(var(--p) * 0.5%),
    var(--violet) calc(var(--p) * 1%),
    rgba(var(--tint),.08) calc(var(--p) * 1%));
  box-shadow: 0 0 34px rgba(169,139,240,.28);
}

/* ---------- Кнопки-иконки в панелях ---------- */
.panel-head .btn-sm { background: rgba(var(--tint),.05); }

/* ---------- Бейджи и подсказки ---------- */
.note { background: linear-gradient(90deg, rgba(240,182,79,.14), rgba(240,182,79,.04)); }
.hw-badge.ok, .hw-pill.hw-graded { background: rgba(79,209,165,.18); color: var(--ok-txt); border-color: rgba(79,209,165,.45); }
.hw-badge.wait, .hw-pill.hw-waiting { background: rgba(240,182,79,.16); color: var(--gold-txt); border-color: rgba(240,182,79,.45); }

/* ---------- Ссылки-плитки в нижнем меню ---------- */
.mnav a.active .ni { filter: drop-shadow(0 0 8px rgba(240,182,79,.6)); }

/* ---------- Мягкое появление страниц ---------- */
#view > div { animation: pageIn .32s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  #view > div { animation: none; }
  .tile:hover, .btn:hover, .lesson-row:hover { transform: none; }
}

/* ---------- Светлая тема: акценты темнее, ореолы мягче ---------- */
:root:not([data-theme="dark"]) .hero::before { opacity: .32; }
:root:not([data-theme="dark"]) .hero::after { opacity: .5; }
:root:not([data-theme="dark"]) .tile { background: var(--panel); }
:root:not([data-theme="dark"]) .tile::after { opacity: .35; }
:root:not([data-theme="dark"]) .panel > h3::before { opacity: .85; }

@media (max-width: 900px) {
  .hero::before { width: 170px; height: 170px; right: -30px; top: -60px; }
  .page-title { font-size: 22px; }
}
:root:not([data-theme="dark"]) .progress-ring { box-shadow: 0 0 24px rgba(122,92,196,.2); }
:root:not([data-theme="dark"]) #nav { border-right-color: rgba(30,20,45,.07); }

.tile:hover { border-color: var(--ic-line, var(--gold)); }
.tile:nth-child(12n+2):hover { border-color: var(--ic-line); }
/* в светлой теме ореолы плиток мягче, чтобы не «кричали» */
:root:not([data-theme="dark"]) .tile::after { opacity: .28; }
:root:not([data-theme="dark"]) .tile:hover::after { opacity: .45; }
:root:not([data-theme="dark"]) .tile:hover { box-shadow: 0 8px 20px rgba(60,40,25,.12); }

/* ---------- Чат помощника: «думаю» и живые карточки слов ---------- */
.t-thinking { display: inline-flex; align-items: center; gap: 6px; color: var(--txt2); font-style: italic; }
.t-dots { display: inline-flex; gap: 3px; margin-left: 2px; }
.t-dots i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
  animation: tDot 1s infinite ease-in-out;
}
.t-dots i:nth-child(2) { animation-delay: .15s; }
.t-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes tDot {
  0%, 60%, 100% { opacity: .25; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}
.t-bubble .tw-card:first-of-type { margin-top: 8px; }
.t-bubble .tw-row { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px dashed rgba(var(--tint),.07); }
.t-bubble .tw-row:last-child { border-bottom: none; }
.t-bubble .tw-note { margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { .t-dots i { animation: none; } }

/* ---------- Помощник: ссылки на источники ---------- */
.t-links {
  margin-top: 10px; font-size: 12.5px; color: var(--txt3);
  display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
}
.t-links a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
.t-links a:hover { color: var(--gold); }
.tw-src-card { border-left: 3px solid var(--violet); }
.tw-src-card .tw-src { display: block; margin-top: 4px; }

/* Бейдж «ответ из словарей» — чтобы ученик видел происхождение факта */
.t-src-badge {
  display: inline-flex; align-items: center; gap: 5px; margin-bottom: 8px;
  padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: rgba(116,169,239,.16); color: var(--blue);
  border: 1px solid rgba(116,169,239,.35);
}
:root:not([data-theme="dark"]) .t-links a { color: #2f5f9e; }

/* ---------- Кто сейчас на сайте ---------- */
.live-list { display: flex; flex-direction: column; gap: 2px; }
.live-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 4px; border-bottom: 1px solid var(--line);
}
.live-row:last-child { border-bottom: none; }
.live-dot {
  width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
  background: var(--green, #4ec97e); box-shadow: 0 0 0 4px rgba(78,201,126,.18);
}
.live-dot.off { background: var(--txt3); box-shadow: none; }
.live-name { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.live-name b { font-size: 14px; }
.live-name i { font-size: 11.5px; color: var(--txt3); font-style: normal; }
.live-when { font-size: 12px; color: var(--txt3); white-space: nowrap; }
.live-when.bad { color: var(--red, #e5674f); }

/* Столбики заходов по дням */
.days-chart {
  display: flex; align-items: flex-end; gap: 6px;
  height: 140px; padding-top: 8px;
}
.day-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.day-bar {
  width: 100%; max-width: 34px; border-radius: 5px 5px 0 0;
  background: linear-gradient(180deg, var(--gold), rgba(116,169,239,.75));
  transition: height .3s ease;
}
.day-bar.off { background: var(--line); }
.day-num { font-size: 11px; color: var(--txt2); margin-top: 4px; min-height: 14px; }
.day-lbl { font-size: 10px; color: var(--txt3); white-space: nowrap; }
@media (max-width: 640px) {
  .day-lbl { font-size: 9px; }
  .days-chart { gap: 3px; height: 120px; }
  /* На телефоне список учеников читается лучше карточками, чем
     горизонтальной прокруткой таблицы. */
  .st-row { min-width: 0; grid-template-columns: 1fr auto; row-gap: 4px; }
  .st-head { display: none; }
  .st-row > span:nth-child(2)::before { content: 'уроки: '; color: var(--txt3); }
  .st-row > span:nth-child(3)::before { content: 'балл: '; color: var(--txt3); }
  .st-row > span:nth-child(4)::before { content: 'точность: '; color: var(--txt3); }
  .st-row > span:nth-child(5)::before { content: 'карточки: '; color: var(--txt3); }
  .st-row > span:nth-child(6)::before { content: 'дней: '; color: var(--txt3); }
  .st-row > span:nth-child(7)::before { content: 'был: '; color: var(--txt3); }
  .st-row > span:nth-child(8)::before { content: 'оценка: '; color: var(--txt3); }
  .live-row { padding: 8px 2px; }
}

/* ---------- Каракули ----------
   Нарисованные «от руки» пометки: звёздочка, стрелка, птичка, волна,
   иероглиф с карандашной подчёркиванием. Все линии проходят через
   SVG-фильтр с шумом, поэтому не бывают математически ровными.
   Вставляются как .scrawl.scrawl-<вид> (см. app.js → scrawl()). */
.scrawl { position: relative; display: inline-block; vertical-align: middle; }
.scrawl svg { display: block; width: 100%; height: 100%; overflow: visible; }
.scrawl svg path, .scrawl svg circle, .scrawl svg text { fill: none; stroke: currentColor; stroke-linecap: round; }
.scrawl svg text { fill: currentColor; stroke: none; }
.scrawl svg circle[r="2.6"] { fill: currentColor; stroke: none; }
.scrawl.spark, .scrawl.check, .scrawl.bang, .scrawl.curl { width: 64px; height: 64px; color: var(--gold2); }
.scrawl.arrow { width: 76px; height: 58px; color: var(--red2); }
.scrawl.wave { width: 72px; height: 40px; color: var(--jade); }
.scrawl.cn { width: 96px; height: 96px; color: rgba(35,31,44,.13); }
.scrawl.cn.accent { color: rgba(178,58,46,.16); }

/* ---------- Мелочи «от руки» ---------- */
/* Подсказка со стрелкой в пустой статистике: каракуля указывает на кнопку. */
.start-row { align-items: center; position: relative; }
.start-hint {
  display: inline-flex; flex-direction: column; align-items: center;
  color: var(--red2); margin-right: 2px; transform: translateY(-6px);
}
.start-hint i { font-style: normal; font-size: 12px; color: var(--txt3); letter-spacing: .3px; }
.qd-emoji { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
/* Каракули не должны ловить клики и попадать в табуляцию. */
.scrawl { pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .scrawl { transform: none !important; }
}

/* ---------- Рукописные пометки ---------- */
/* Надпись «от руки» рядом с заголовком: наклон, другой шрифт, светлее.
   Специально не курсив браузера — он выглядит одинаково на всех сайтах. */
.hero-hand {
  display: inline-block; margin: -4px 0 14px;
  font-family: "Bradley Hand", "Segoe Script", "Comic Sans MS", "Noto Serif SC", cursive;
  font-size: 13px; color: var(--txt3); opacity: .8;
  transform: rotate(-2.4deg); letter-spacing: .2px;
}
/* Подзаголовок страницы: тонкая карандашная линия под текстом,
   неровная по краям — как подчёркивают в конспекте. */
.page-sub { position: relative; }
.page-sub::after {
  content: ''; position: absolute; left: 0; bottom: -7px; width: min(58%, 320px); height: 3px;
  background: linear-gradient(90deg, rgba(154,112,22,.34), rgba(154,112,22,.10) 70%, transparent);
  clip-path: polygon(0 40%, 12% 62%, 30% 38%, 52% 60%, 72% 40%, 100% 56%, 100% 100%, 0 100%);
  filter: url(#rough-line);
}
.site-foot b { position: relative; }
/* Подпись автора — как росчерк: короткая дуга под именем. */
.site-foot b::after {
  content: ''; position: absolute; left: -6%; right: -6%; bottom: -5px; height: 5px;
  border-bottom: 1.5px solid rgba(178,58,46,.55); border-radius: 50%;
  transform: rotate(-1.5deg); filter: url(#rough-line);
}

/* ---------- «Вырезано руками» ----------
   Идеально одинаковые углы — признак машинной вёрстки. У живого листа
   бумаги один угол подвёрнут сильнее другого, поэтому скругления
   у карточек и кнопок асимметричны. Разница в пару пикселей: заметно
   не глазом, а ощущением. */
.tile { border-radius: 17px 13px 15px 12px; }
.panel { border-radius: 16px 12px 14px 11px; }
.btn { border-radius: 12px 9px 11px 8px; }
.card-item, .hw-task, .vcard, .dict-row { border-radius: 12px 9px 11px 8px; }
#nav a { border-radius: 11px 8px 10px 8px; }
.panel::before { border-radius: 11px 8px 9px 7px; }

/* Загнутый угол у панели — как у страницы, которую листали. */
.panel::after {
  content: ''; position: absolute; right: 0; top: 0; width: 22px; height: 22px;
  background: linear-gradient(225deg, var(--bg2) 0 50%, transparent 50%);
  border-bottom-left-radius: 6px;
  box-shadow: -1px 1px 2px rgba(90,64,30,.10);
  opacity: .85; pointer-events: none;
}
:root[data-theme="dark"] .panel::after {
  background: linear-gradient(225deg, var(--panel2) 0 50%, transparent 50%);
}

/* Пунктир «карандашом» вместо ровной линии в служебных блоках. */
.empty, .hw-note, .qd-unlock {
  border-top: 1px dashed rgba(154,112,22,.35); padding-top: 8px;
}

/* Наклейка-заметка от руки: бумажка на «скотче», чуть повёрнутая. */
.hand-note {
  position: relative; display: inline-block; margin: 4px 0 14px;
  padding: 9px 14px 8px;
  background: linear-gradient(180deg, #fff9e6, #fdf2d6);
  border: 1px solid rgba(154,112,22,.28);
  font-family: "Bradley Hand", "Segoe Script", "Comic Sans MS", "Noto Serif SC", cursive;
  font-size: 13.5px; line-height: 1.35; color: #6b4a12;
  transform: rotate(-1.6deg);
  box-shadow: 0 2px 6px rgba(90,64,30,.14), 0 12px 24px rgba(90,64,30,.08);
  max-width: 320px;
}
/* Полоска «скотча» сверху и снизу. */
.hand-note::before, .hand-note::after {
  content: ''; position: absolute; left: 50%; width: 62px; height: 15px;
  transform: translateX(-50%) rotate(-2deg);
  background: rgba(226,214,180,.55);
  border-left: 1px solid rgba(255,255,255,.6);
  border-right: 1px solid rgba(255,255,255,.6);
}
.hand-note::before { top: -7px; }
.hand-note::after { bottom: -7px; transform: translateX(-50%) rotate(1.6deg); }
:root[data-theme="dark"] .hand-note {
  background: linear-gradient(180deg, #3a3150, #322a48);
  border-color: rgba(240,182,79,.24); color: #f6dfae;
}
:root[data-theme="dark"] .hand-note::before,
:root[data-theme="dark"] .hand-note::after { background: rgba(240,182,79,.16); }

/* ---------- Детский первый урок: пиньинь крупно и первым ----------
   Ученики читают только с пиньинем, поэтому он — главный текст:
   крупный, первый, с разбором по слогам. Иероглиф — вторая строка. */

.kid-intro .kid-lead {
  color: var(--txt2); font-size: 14px; line-height: 1.55;
  margin: 6px 0 14px; max-width: 660px;
}
.kid-tones-h { margin-top: 24px; }

/* Таблица «как читать»: группа букв — крупно, русская подсказка под ней. */
.pg-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
  gap: 10px; margin: 12px 0 6px;
}
.pg-cell {
  background: rgba(var(--tint),.05);
  border: 1px solid var(--line);
  border-radius: 12px 9px 11px 8px;
  padding: 10px 12px;
}
.pg-g { font-size: 19px; font-weight: 700; letter-spacing: .5px; color: var(--gold); }
.pg-ru { font-size: 14px; color: var(--txt); margin: 2px 0 4px; }
.pg-note { font-size: 12.5px; color: var(--txt2); line-height: 1.45; }

/* Карточки тонов: контур голоса, слово-пример, озвучка и медленный повтор. */
.tone-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px; margin: 12px 0 6px;
}
.tone-card {
  background: rgba(var(--tint),.05);
  border: 1px solid var(--line);
  border-radius: 14px 10px 13px 9px;
  padding: 12px 14px;
}
.tc-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.tc-mark { font-size: 27px; font-weight: 700; color: var(--red); line-height: 1.1; }
.tc-name { font-size: 12.5px; color: var(--txt2); font-weight: 600; }
.tone-curve { width: 100%; height: 46px; display: block; margin: 4px 0 6px; }
.tc-voice { font-size: 12.5px; color: var(--txt2); line-height: 1.45; min-height: 38px; }
.tc-ex { font-size: 13px; margin-top: 6px; color: var(--txt); }
.tc-ex-p { color: var(--gold); }
.tc-btns { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

/* Детская карточка слова: пиньинь первым и крупно, иероглиф — второй. */
.kid-vocab { grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); }
.kid-card { padding: 14px 16px 12px; }
.kid-p { font-size: 25px; font-weight: 700; letter-spacing: .4px; line-height: 1.15; color: var(--txt); }
.kid-syls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 7px 0 9px; }
.syl {
  display: inline-flex; flex-direction: column; align-items: center;
  background: rgba(var(--tint),.08);
  border: 1px solid var(--line);
  border-radius: 10px 8px 9px 7px;
  padding: 4px 9px 3px;
}
.syl b { font-size: 16.5px; font-weight: 700; color: var(--gold); }
.syl i { font-style: normal; font-size: 10.5px; color: var(--txt3); margin-top: 1px; }
.syl-sep { color: var(--txt3); }
.kid-h { font-size: 20px; letter-spacing: 2px; font-family: "Noto Serif SC", serif; }
:root:not([data-theme="dark"]) .kid-h { color: var(--red); }
.kid-ru { font-size: 12px; color: var(--txt3); margin-top: 6px; }
.kid-ru b { color: var(--txt2); }
.kid-r { font-size: 13.5px; color: var(--txt); margin-top: 2px; }
.kid-note {
  font-size: 12.5px; color: var(--txt2); line-height: 1.45;
  background: rgba(var(--tint),.05);
  border-left: 3px solid var(--gold);
  border-radius: 4px 8px 4px 8px;
  padding: 6px 9px; margin-top: 9px;
}
.kid-tools { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.tone-badges { display: inline-flex; gap: 4px; margin-right: auto; }
.tone-badge {
  width: 21px; height: 21px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 700;
  border: 1.5px solid var(--gold); color: var(--gold);
}
.tone-badge.t2 { border-color: var(--jade); color: var(--jade); }
.tone-badge.t3 { border-color: var(--red2); color: var(--red2); }
.tone-badge.t4 { border-color: var(--red); color: var(--red); }
.tone-badge.t0 { border-color: var(--line); color: var(--txt3); }

/* Диалог по ролям: реплика — пиньинь крупно, озвучка справа. */
.dlg-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.dlg-row {
  display: flex; gap: 12px; align-items: flex-start;
  background: rgba(var(--tint),.05);
  border: 1px solid var(--line);
  border-radius: 12px 9px 11px 8px;
  padding: 10px 14px;
}
.dlg-row:nth-child(odd) { transform: rotate(-.45deg); }
.dlg-row:nth-child(even) { transform: rotate(.4deg); }
.dlg-who {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
  background: var(--red); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; margin-top: 2px;
}
.dlg-body { flex: 1 1 auto; min-width: 0; }
.dlg-p { font-size: 20px; font-weight: 700; letter-spacing: .4px; line-height: 1.25; }
.dlg-h { font-family: "Noto Serif SC", serif; font-size: 16px; margin-top: 3px; }
.dlg-r { color: var(--txt3); font-size: 12.5px; font-family: inherit; }
.dlg-ru { font-size: 12.5px; color: var(--txt3); margin-top: 3px; }
.dlg-btns { flex: 0 0 auto; display: flex; gap: 6px; }
@media (max-width: 560px) {
  .dlg-row { flex-wrap: wrap; }
  .dlg-btns { order: 3; }
}

/* ---------- Голосовой учитель-панда Мэймэй ----------
   Панель в каждом уроке: панда слева, объяснение текстом рядом.
   Во время речи у панды анимируется рот, в покое она моргает. */

.panda-teacher {
  display: flex; gap: 16px; align-items: flex-start;
  margin-bottom: 18px;
}
.pa-wrap {
  flex: 0 0 84px; width: 84px; height: 84px; padding: 0;
  background: none; border: none; cursor: pointer; border-radius: 50%;
}
.pa-wrap:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.pa-svg { width: 84px; height: 84px; display: block; }
.pa-face { fill: #fff; stroke: #2b2430; stroke-width: 3; }
.pa-dark { fill: #2b2430; }
.pa-blush { fill: #f3b0a0; opacity: .55; }
.pa-mouth-closed { stroke: #2b2430; stroke-width: 3; stroke-linecap: round; }
.pa-mouth-open { fill: #7a4a48; opacity: 0; transform-box: fill-box; transform-origin: center; }
.pa-eye { transform-box: fill-box; transform-origin: center; animation: paBlink 4.4s infinite; }
@keyframes paBlink {
  0%, 91%, 100% { transform: scaleY(1); }
  94% { transform: scaleY(.1); }
  97% { transform: scaleY(1); }
}
.panda-teacher.talking .pa-mouth-open {
  opacity: 1; animation: paTalk .3s infinite alternate;
}
.panda-teacher.talking .pa-mouth-closed { opacity: 0; }
@keyframes paTalk {
  from { transform: scaleY(.35); }
  to { transform: scaleY(1.5); }
}
@media (prefers-reduced-motion: reduce) {
  .pa-eye, .panda-teacher.talking .pa-mouth-open { animation: none; }
}

.pa-body { flex: 1 1 auto; min-width: 0; }
.pa-name { font-weight: 700; font-size: 14.5px; color: var(--txt); }
.pa-hint { font-weight: 400; font-size: 12px; color: var(--txt3); margin-left: 6px; }
.pa-text {
  font-size: 14px; line-height: 1.6; color: var(--txt2);
  margin: 6px 0 10px; max-width: 680px;
}
.pa-actions { display: flex; align-items: center; gap: 8px; }
@media (max-width: 560px) {
  .panda-teacher { flex-direction: column; align-items: center; text-align: center; }
  .pa-actions { justify-content: center; }
}

/* ---------- Ступеньки урока: путь, которым Мэймэй ведёт ученика ---------- */
.steps-path .sp-title { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
.sp-row {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
}
.step-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px 8px 9px;
  background: rgba(var(--tint),.05);
  border: 1.5px solid var(--line);
  border-radius: 13px 10px 12px 9px;
  cursor: pointer; font: inherit; color: var(--txt);
  transition: .15s;
}
.step-chip:hover { border-color: var(--gold); background: rgba(var(--tint),.09); transform: translateY(-1px); }
.step-chip:disabled { opacity: .55; cursor: default; }
.sc-num {
  width: 20px; height: 20px; border-radius: 50%; flex: 0 0 20px;
  background: var(--red); color: var(--on-accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 700;
}
.sc-ic { font-size: 16px; }
.sc-t { font-size: 13px; font-weight: 600; }
.steps-path .kid-lead { margin: 4px 0 0; }

/* ---------- Подсказка Мэймэй у раздела ---------- */
.pa-tip {
  display: flex; align-items: flex-start; gap: 10px;
  background: rgba(var(--tint),.05);
  border: 1px dashed var(--gold);
  border-radius: 12px 9px 11px 8px;
  padding: 9px 12px; margin: 10px 0 14px;
}
.pa-tip .pa-svg { width: 34px; height: 34px; flex: 0 0 34px; }
.pt-text { flex: 1 1 auto; font-size: 13px; line-height: 1.5; color: var(--txt2); }

/* ---------- Пример от Мэймэй в панели учителя ---------- */
.pa-example {
  margin-top: 10px; padding: 10px 13px;
  background: rgba(var(--tint),.05);
  border-left: 3px solid var(--red);
  border-radius: 4px 10px 4px 10px;
  position: relative;
}
.pex-t { font-size: 11.5px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: .5px; }
.pex-p { font-size: 21px; font-weight: 700; margin-top: 4px; letter-spacing: .3px; }
.pex-h { font-family: "Noto Serif SC", serif; font-size: 15px; margin-top: 2px; }
.pex-r { font-size: 12.5px; color: var(--txt3); margin-top: 2px; }
.pa-example .speak { position: absolute; top: 8px; right: 8px; }

/* ---------- Подсказка в практике ---------- */
.hint-btn {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 10px; padding: 7px 12px;
  background: rgba(var(--tint),.05);
  border: 1.5px dashed var(--gold);
  border-radius: 11px 9px 11px 9px;
  cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--txt);
}
.hint-btn:hover:not(:disabled) { background: rgba(var(--tint),.09); }
.hint-btn:disabled { opacity: .75; cursor: default; }
.hint-btn .hint-t { font-weight: 400; font-size: 11.5px; color: var(--txt3); }
.q-hint-bubble {
  display: none; margin-top: 8px; padding: 9px 12px;
  background: rgba(var(--tint),.06);
  border-left: 3px solid var(--gold);
  border-radius: 4px 9px 4px 9px;
  font-size: 13.5px; line-height: 1.5; color: var(--txt);
}
.q-hint-bubble.open { display: block; }

/* Мэймэй и ступеньки — один блок-помощник: аватар и объяснение сверху,
   путь урока ниже, на всю ширину панели. */
.panda-teacher { flex-wrap: wrap; }
.steps-block {
  flex: 1 1 100%;
  border-top: 1px dashed var(--line);
  margin-top: 6px;
  padding-top: 14px;
}

/* Видимый источник голоса: бейдж записи и пометка фолбэка. */
.pa-voice-badge {
  font-size: 10.5px; font-weight: 700; color: var(--jade);
  border: 1px solid var(--jade); border-radius: 9px;
  padding: 1px 7px; margin-left: 6px; letter-spacing: .3px;
}
.pa-synth-note {
  display: none;
  flex: 1 1 100%;
  margin-top: 10px; padding: 8px 12px;
  background: rgba(178,58,46,.08);
  border: 1px solid var(--red);
  border-radius: 10px 8px 10px 8px;
  font-size: 12.5px; color: var(--bad-txt);
}

/* ---------- Мэймэй в чате: аватар у ответов + кнопка русской озвучки ---------- */
.t-bot { align-items: flex-start; }
.pa-mini { flex: 0 0 32px; width: 32px; height: 32px; margin-right: 8px; margin-top: 2px; }
.pa-mini .pa-svg { width: 32px; height: 32px; display: block; }
.t-voice-ru { margin-left: 6px; }

/* ---------- Азбука пиньинь ---------- */
.pabc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px; margin-top: 12px;
}
.pabc-card {
  background: rgba(var(--tint),.05);
  border: 1px solid var(--line);
  border-radius: 12px 9px 11px 8px;
  padding: 10px 12px;
  position: relative;
}
.pabc-final .pabc-k { color: var(--jade); }
.pabc-k { font-size: 26px; font-weight: 700; letter-spacing: .5px; color: var(--gold); line-height: 1.1; }
.pabc-ru { font-size: 14px; color: var(--txt); margin: 2px 0 6px; }
.pabc-ex { font-size: 13px; line-height: 1.4; }
.pabc-syl { color: var(--red); font-size: 15px; }
.pabc-h { font-family: "Noto Serif SC", serif; margin-left: 4px; }
.pabc-r { color: var(--txt3); font-size: 12px; margin-left: 4px; }
.pabc-note { font-size: 12px; color: var(--txt2); line-height: 1.4; margin-top: 6px; }
.pabc-tools { position: absolute; top: 8px; right: 8px; }
.pabc-tricky {
  font-size: 13.5px; color: var(--txt2); line-height: 1.55;
  background: rgba(var(--tint),.05);
  border-left: 3px solid var(--gold);
  border-radius: 4px 9px 4px 9px;
  padding: 9px 12px; margin: 8px 0;
}
.pabc-tricky b { color: var(--txt); }
.pabc-about .kid-lead { margin: 6px 0; }
.pabc-demo {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin-top: 12px; padding: 12px;
  background: rgba(var(--tint),.05);
  border: 1px dashed var(--line);
  border-radius: 12px 9px 11px 8px;
}
.pd-part {
  display: inline-flex; flex-direction: column; align-items: center;
  background: var(--panel); border: 1.5px solid var(--line);
  border-radius: 10px 8px 9px 7px; padding: 6px 12px;
}
.pd-part b { font-size: 22px; }
.pd-syl { border-color: var(--gold); }
.pd-syl b { color: var(--red); font-family: "Noto Serif SC", serif; }
.pd-label { font-size: 10px; color: var(--txt3); text-transform: uppercase; letter-spacing: .5px; }
.pd-plus, .pd-eq, .pd-mid { font-size: 20px; color: var(--txt3); font-weight: 700; }
.pabc-next .btn-row { margin-top: 8px; }
.pg-abc { margin-top: 12px; }

/* ---------- Мозг Мэймэй: честный статус и бейджи ---------- */
.t-brain { font-size: 12.5px; color: var(--txt3); margin: 6px 0 0; }
.t-brain-state.on { color: var(--jade); font-weight: 600; }
.t-brain-state.dim { color: var(--txt3); }
.t-mode {
  display: inline-block; font-size: 10.5px; line-height: 1.6;
  padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(var(--tint), .06);
  color: var(--txt2); margin-bottom: 6px;
}
.t-mode-ai { color: var(--jade); border-color: var(--jade); }
.t-mode-sources { color: var(--gold); border-color: var(--gold); }

/* ---------- Режим Джарвиса: микрофон и автоозвучка ---------- */
.t-mic-live {
  animation: t-mic-pulse 1.2s ease-in-out infinite;
  border-color: var(--red); color: var(--red);
}
@keyframes t-mic-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(var(--tint), .25); }
  50% { box-shadow: 0 0 0 8px rgba(var(--tint), .06); }
}
.t-mic-note {
  font-size: 12.5px; color: var(--txt2); line-height: 1.45;
  background: rgba(var(--tint), .06);
  border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; margin-top: 8px;
}

/* ---------- Комната голосового разговора (Джарвис) ---------- */
.t-room {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(var(--tint), .45);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.t-room-card {
  position: relative;
  width: min(420px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px 14px 16px 12px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
  padding: 18px 16px 16px;
  text-align: center;
}
.t-room-x {
  position: absolute; top: 8px; right: 10px;
  background: none; border: none; font-size: 20px;
  color: var(--txt3); cursor: pointer; padding: 4px 8px;
}
.t-room-avatar { margin: 2px auto 8px; width: 120px; }
.t-room-avatar svg { width: 120px; height: 120px; }
.t-room-avatar.listening { animation: t-room-pulse 1.4s ease-in-out infinite; }
.t-room-avatar.talking svg { animation: t-room-bounce .9s ease-in-out infinite; }
@keyframes t-room-pulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(var(--tint),0)); }
  50% { transform: scale(1.06); filter: drop-shadow(0 0 14px rgba(var(--tint),.35)); }
}
@keyframes t-room-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.t-room-status { font-size: 14px; color: var(--txt); line-height: 1.5; margin: 4px 0 10px; }
.t-room-heard { font-size: 15px; color: var(--gold); margin-bottom: 8px; }
.t-room-feed {
  max-height: 200px; overflow-y: auto; text-align: left;
  font-size: 13.5px; line-height: 1.45; margin-bottom: 10px;
}
.tr-q {
  background: rgba(var(--tint),.08);
  border-radius: 10px 10px 3px 10px;
  padding: 6px 10px; margin: 6px 0 2px 40px;
}
.tr-a {
  background: rgba(var(--tint),.04);
  border: 1px solid var(--line);
  border-radius: 10px 10px 10px 3px;

    subtitle: 'Моя семья: кто есть кто',
    /* Пример от Мэймэй: живая фраза урока для карточки «Пример». */
    example: { h: '我有两个姐姐。', p: 'wǒ yǒu liǎng ge jiě jie.', r: 'У меня две старшие сестры.' },
    /* Речь учителя-панды: нажми «Объяснить урок» — Мэймэй прочитает это голосом. */
    teacher: 'Сегодня — про семью! Ю — «есть, имею»: во ю цзе-цзе — у меня есть старшая сестра. А «дэ» — как наше «-ин»: во дэ шу — моя книга. Твоё задание, ученик: нарисуй семью и подпиши каждого пиньинем. Так слова запомнятся в два раза быстрее!',
    goals: ['Рассказать о семье', 'Понять разницу 的 и 得', 'Сказать «у меня есть…»'],
    vocab: [
      { h: '家', p: 'jiā', r: 'семья; дома' },
      { h: '父母', p: 'fù mǔ', r: 'родители' },
      { h: '爸爸', p: 'bà ba', r: 'папа' },
      { h: '妈妈', p: 'mā ma', r: 'мама' },
      { h: '哥哥', p: 'gē ge', r: 'старший брат' },
      { h: '弟弟', p: 'dì di', r: 'младший брат' },
      { h: '姐姐', p: 'jiě jie', r: 'старшая сестра' },
      { h: '妹妹', p: 'mèi mei', r: 'младшая сестра' },
      { h: '孩子', p: 'hái zi', r: 'ребёнок' },
      { h: '先生', p: 'xiān sheng', r: 'господин; учитель' },
      { h: '小姐', p: 'xiǎo jie', r: 'мисс' },
      { h: '有', p: 'yǒu', r: 'иметь; есть' },
      { h: '没有', p: 'méi yǒu', r: 'не иметь; нет' },
      { h: '也', p: 'yě', r: 'тоже' },
      { h: '都', p: 'dōu', r: 'все; всё' },
      { h: '很', p: 'hěn', r: 'очень' },
      { h: '喜欢', p: 'xǐ huan', r: 'любить' },
      { h: '爱', p: 'ài', r: 'любить (сильнее)' }
    ],
    grammar: [
      { t: '有 = «у меня есть»', b: '<b>我有两个哥哥。</b> — У меня есть два старших брата. Глагол <b>有</b> (yǒu) ставится перед существительным. Отрицание — <b>没有</b> (méi yǒu), причём 没有 меняет тон <b>没</b> на 2-й: <b>mái yǒu</b>.' },
      { t: '的 в роли «из»', b: '<b>我来自塔吉克斯坦。</b> — Я из Таджикистана. <b>中国的学生</b> — студент из Китая. После 的 может стоять и прилагательное: <b>漂亮的女人</b>.' },
      { t: '的 и 得 — не путать', b: 'Это самое частое место ошибок.<br>• <b>的</b> стоит перед существительным и отвечает на вопрос «чей / какой»: <b>我的书</b> — моя книга, <b>漂亮的姑娘</b> — красивая девушка.<br>• <b>得</b> стоит после глагола и показывает, как выполнено действие: <b>跑得快</b> — бегает быстро, <b>说得好</b> — говорит хорошо.' },
      { t: '也 и 都', b: '<b>也</b> (тоже) — «я тоже»: <b>我也学中文。</b> <b>都</b> (все) — «все/всё»: <b>我们都是学生。</b> В отрицании: <b>都不</b> = «никто не».' },
      { t: '很 + прилагательное', b: '<b>很好</b> (очень хорошо), <b>很高兴</b>. В разговоре <b>很</b> часто не значит «очень» — оно просто делает фразу законченной. <b>我很好</b> — это «у меня всё хорошо», а не «у меня очень хорошо».' }
    ],
    quiz: [
      { k: 'mcq', q: '«Мама» — это…', o: ['哥哥', '弟弟', '爸爸', '妈妈'], a: 3, h: '妈妈 (mā ma) — мама, первый слог высоким тоном.' },
      { k: 'mcq', q: '«У меня есть старшая сестра» — как сказать?', o: ['我有姐姐。', '我有弟弟。', '我有妹妹。', '我有哥哥。'], a: 0, h: '姐姐 — старшая сестра, 妹妹 — младшая. 有 — «иметь».' },
      { k: 'mcq', q: 'Что значит «都»?', o: ['очень', 'тоже', 'только', 'все, всё'], a: 3, h: '都 (dōu) — «все»; 也 (yě) — «тоже».' },
      { k: 'mcq', q: '«Это моя книга» — как сказать?', o: ['这是书我的。', '这是我书。', '这是我的书。'], a: 2, h: '的 показывает принадлежность и стоит между «кем» и «чем».' },
      { k: 'mcq', q: 'Выберите пропущенное слово: 我 ___ 喜欢中国菜。', o: ['都', '也', '是', '哪'], a: 1, h: '也 — «тоже»: я тоже люблю китайскую еду.' },
      { k: 'order', q: 'Соберите: «Он тоже студент»', o: ['也', '他', '是', '学生'], a: [1, 0, 2, 3] },
      { k: 'listen', q: 'Что вы услышали?', o: ['先生', '喜欢', '父母', '小姐'], a: 1, speak: '喜欢', h: '喜欢 — xǐ huan · любить' },
      { k: 'listen', q: 'Что вы услышали?', o: ['没有', '喜欢', '父母', '弟弟'], a: 2, speak: '父母', h: '父母 — fù mǔ · родители' }
    ],
    hw: ['Расскажите о своей семье по-китайски — 6–8 предложений.', 'Составьте 5 предложений с 的 и 3 предложения с 得.', 'Выучите дни рождения членов семьи.']
  },

  l4: {

    /* Речь учителя-панды: нажми «Объяснить урок» — Мэймэй прочитает это голосом. */
    teacher: 'Сегодня мы в ресторане — и я уже голодная! Дянь — заказывать: во яо дянь цай. Похвалить повара просто: хао-чи — вкусно! Слишком острое? Тай-ла-лэ — слишком остро! Ну-ка, закажи себе любимое блюдо по-китайски. Приятного аппетита!',
    goals: ['Заказать еду в ресторане', 'Спросить «вкусно / остро / без лука»', 'Оплатить счёт'],
    vocab: [
      { h: '吃', p: 'chī', r: 'есть, кушать' },
      { h: '喝', p: 'hē', r: 'пить' },
      { h: '饭', p: 'fàn', r: 'рис; еда (обед)' },
      { h: '面', p: 'miàn', r: 'лапша; тесто' },
      { h: '菜', p: 'cài', r: 'блюдо; овощи' },
      { h: '肉', p: 'ròu', r: 'мясо' },
      { h: '鱼', p: 'yú', r: 'рыба' },

      { h: '好吃', p: 'hǎo chī', r: 'вкусно' },
      { h: '好吃吗', p: 'hǎo chī ma', r: 'вкусно?' },
      { h: '太辣了', p: 'tài là le', r: 'слишком остро' },
      { h: '不辣', p: 'bù là', r: 'не остро' },
      { h: '不要葱', p: 'bú yào cōng', r: 'без лука' },
      { h: '点菜', p: 'diǎn cài', r: 'заказывать блюда' },
      { h: '买单', p: 'mǎi dān', r: 'рассчитаться' },
      { h: '服务员', p: 'fú wù yuán', r: 'официант' },
      { h: '好吃！', p: 'hǎo chī', r: 'вкусно!' },
      { h: '太饱了', p: 'tài bǎo le', r: 'сыт по горло' }
    ],
    grammar: [
      { t: '点 + блюдо', b: '<b>我要一份牛肉面。</b> — Я хочу порцию лапши с говядиной. <b>一份</b> — «одна порция». На блюда используют 份 (fèn), на суп — 碗 (wǎn), на чашку чая — 杯 (bēi).' },
      { t: 'Частица 了 (1) — изменение состояния', b: '<b>我吃了午饭。</b> — Я поел (пообедал). 了 после глагола показывает, что действие завершилось и ситуация изменилась. Сравните: <b>我吃饭</b> (я обычно ем) и <b>我吃了饭</b> (я поел).' },
      { t: 'Не есть / не хотеть: 别 и 不要', b: '<b>不要葱</b> — без лука. <b>别</b> — «не надо (делай)» с глаголом: <b>别担心</b> — не волнуйся.' },

      { k: 'mcq', q: 'Что значит «太饱了»?', o: ['не остро', 'очень вкусно', 'слишком остро', 'сыт по горло'], a: 3, h: '饱 (bǎo) — сытый, 太…了 — «слишком».' },

      { k: 'mcq', q: 'Кого позвать, чтобы сделать заказ?', o: ['医生', '服务员', '同事', '老板'], a: 1, h: '服务员 (fú wù yuán) — официант.' },
      { k: 'mcq', q: 'Что значит «买单»?', o: ['пить', 'рассчитаться', 'заказывать блюда', 'кушать'], a: 1, h: '买单 — попросить счёт; 点菜 — заказывать.' },
      { k: 'order', q: 'Соберите: «Этот суп очень вкусный»', o: ['很', '这个', '面', '好吃'], a: [1, 2, 0, 3] },
      { k: 'listen', q: 'Что вы услышали?', o: ['服务员', '好吃！', '不要葱', '太辣了'], a: 0, speak: '服务员', h: '服务员 — fú wù yuán · официант' },
      { k: 'listen', q: 'Что вы услышали?', o: ['牛肉面', '不要葱', '好吃！', '太辣了'], a: 0, speak: '牛肉面', h: '牛肉面 — niú ròu miàn · лапша с говядиной' }
    ],
    hw: ['Изучите меню и закажите вслух 3 блюда на китайском.', 'Напишите 6 предложений с 太 и 了.', 'Опишите любимое блюдо по-китайски в 5 предложениях.']
  },

  l5: {
    title: 'Место и время: 在',
    subtitle: 'Где и когда',

    teacher: 'Где ты сейчас? Я — в школе! Слово цзай — «находиться»: во цзай сюэ-сяо. Порядок простой: кто, потом цзай и место, а время — в самое начало! Подумай: где ты бываешь утром, днём, вечером? Скажи три фразы. У тебя получится!',
    goals: ['Сказать, где что находится', 'Спросить «где?» и «когда?»', 'Понять конструкцию 在 + место + 时间'],

      { h: '在', p: 'zài', r: 'находиться в; в' },
      { h: '地方', p: 'dì fang', r: 'место' },
      { h: '学校', p: 'xué xiào', r: 'школа' },
      { h: '公司', p: 'gōng sī', r: 'компания' },
      { h: '家', p: 'jiā', r: 'дом; семья' },

      { h: '哪里', p: 'nǎ lǐ', r: 'где' },

      { h: '那里', p: 'nà lǐ', r: 'там' },

      { h: '明天', p: 'míng tiān', r: 'завтра' },

      { h: '现在', p: 'xiàn zài', r: 'сейчас' },
      { h: '早上', p: 'zǎo shang', r: 'утро' },
      { h: '晚上', p: 'wǎn shang', r: 'вечер' },
      { h: '点', p: 'diǎn', r: 'час (по часам)' },

      { h: '星期', p: 'xīng qī', r: 'неделя' }

    grammar: [
      { t: '在 = «находиться в / по»', b: '<b>我在塔吉克斯坦。</b> — Я в Таджикистане. <b>你在哪里？</b> — Где ты? Ответ: <b>我在杜尚别。</b>' },

      { t: 'Вопросы о месте', b: '<b>哪里 (nǎ lǐ)</b> — где. <b>在哪里</b> — тоже «где», чуть формальнее. <b>这儿 / 那儿</b> — здесь / там.' },

      { t: '了 (2) — новое состояние', b: '<b>他来了。</b> — Он пришёл (теперь он здесь). Часто с глаголами <b>来 / 去</b>, <b>在</b>. Также с прилагательными: <b>我饿了。</b> — Я голоден (раньше не был).' },
      { t: 'Время: 以前 и 以后', b: '<b>以前</b> ставится перед глаголом: <b>以前我去中国。</b> <b>以后</b> — после глагола: <b>我学完以后去中国。</b>' },

  l7: {

    /* Речь учителя-панды: нажми «Объяснить урок» — Мэймэй прочитает это голосом. */
    teacher: 'Два «нет» сегодня в бою: бу и мэй! Бу — когда не хочешь сейчас: во бу цюй — я не иду. Мэй — про прошлое: во мэй-ю цюй — я не ходил. А «бе» — это запрет: бе цзоу — не уходи! Потренируйся вежливо отказываться. Уверяю, это очень сильное умение!',
    goals: ['Различать 不 и 没', 'Отрицать в настоящем и прошлом', 'Понять 没有 и 别'],
    vocab: [
      { h: '不', p: 'bù', r: 'не (с настоящим/будущим)' },
      { h: '没', p: 'méi', r: 'не (в прошлом)' },
      { h: '不是', p: 'bú shì', r: 'не быть; не так' },
      { h: '不是…就是…', p: 'bú shì… jiù shì…', r: 'либо… либо…' },

      { h: '对不起', p: 'duì bu qǐ', r: 'извините' },
      { h: '没空', p: 'méi kòng', r: 'нет времени' },

      { h: '说得慢一点', p: 'shuō de màn yì diǎn', r: 'говорите медленнее' }
    ],
    grammar: [
      { t: '不 vs 没 — правило времени', b: '<b>不</b> — настоящее и будущее: <b>我不去</b> (не пойду). <b>没</b> — прошлое: <b>我没去</b> (не ходил). Прилагательные отрицаются только через <b>不</b>: <b>不好</b>, <b>不漂亮</b>.' },
      { t: 'Правило «三声 + 不»', b: 'Меняет тон само <b>不</b>: перед слогом 4-го тона оно читается 2-м тоном — <b>bú shì</b>, <b>bú qù</b>. Перед 1/2/3-м тоном остаётся 4-м: <b>bù hē</b>, <b>bù lái</b>, <b>bù hǎo</b>.' },
      { t: 'Не иметь: 没有', b: '<b>我没有哥哥。</b> — У меня нет старшего брата. <b>没有</b> можно опустить в разговоре: <b>我没有钱</b> = <b>我没钱</b>.' },
      { t: 'Запрет и просьба: 别 / 不用 / 不要', b: '<b>别着急</b> — не торопись. <b>不用了</b> — не нужно (уже). <b>不要</b> — не надо / не хочу (часто про еду).' },
      { t: 'Частица 不 перед глаголом', b: '<b>听不懂</b> = <b>听 + 不 + 懂</b>. Отрицание «вклинивается» внутрь глагола: <b>听不懂</b>, <b>看不懂</b>, <b>走不动</b>. Не путать: <b>不想去</b> (не хочу идти) ≠ <b>不去</b> (не пойду).' }
    ],
    quiz: [
      { k: 'mcq', q: 'Что значит «听不懂»?', o: ['плохо слышно', 'не хочу слушать', 'не слышу', 'не понимаю на слух'], a: 3, h: '听 — слушать, 不懂 — не понимать. 看不懂 — не понимаю при чтении.' },
      { k: 'mcq', q: '«У меня нет денег» — как сказать?', o: ['我没有钱。', '我不有钱。', '我没钱有。'], a: 0, h: 'Глагол 有 отрицается через 没: 没有. С 不 он не сочетается.' },
      { k: 'mcq', q: 'Выберите пропущенное слово: 昨天我 ___ 去学校。', o: ['不', '不用', '别', '没'], a: 3, h: '昨天 — прошлое, значит 没.' },
      { k: 'mcq', q: 'Что значит «别»?', o: ['не надо (не делай)', 'очень', 'уже', 'тоже'], a: 0, h: '别 + глагол — запрет, просьба не делать.' },

      { k: 'order', q: 'Соберите: «Я не умею говорить по-китайски»', o: ['说', '中文', '不会', '我'], a: [3, 2, 0, 1] },
      { k: 'listen', q: 'Что вы услышали?', o: ['听不懂', '看不懂', '不是', '对不起'], a: 0, speak: '听不懂', h: '听不懂 — tīng bù dǒng · не понимаю на слух' },
      { k: 'listen', q: 'Что вы услышали?', o: ['没有', '没空', '对不起', '没关系'], a: 3, speak: '没关系', h: '没关系 — méi guān xi · ничего страшного' }
    ],
    hw: ['Сделайте 10 предложений: 8 с 不 и 2 с 没.', 'Напишите, что вы умеете и не умеете по-китайски (10 предложений).', 'Прослушайте реплику и ответьте отрицательно 5 раз.']

function sceneLocation(scene, lesson) {
  if (scene.loc && VIDEO_SCENES[scene.loc]) return scene.loc;
  const t = ((lesson && lesson.level) || '') + ' ' + ((lesson && lesson.title) || '');
  if (/аэропорт|Прилёт/i.test(t)) return 'airport';
  if (/такси|Такси|дорог/i.test(t)) return 'taxi';
  if (/отел|Отель/i.test(t)) return 'hotel';
  if (/кафе|Кафе/i.test(t)) return 'cafe';
  if (/класс|Класс|тон|числ/i.test(t)) return 'classroom';
  if (/иероглиф|Прописи|Письмо/i.test(t)) return 'brush';
  return 'studio';
}

/* ---------- облако: плотная масса с контуром ---------- */
function artCloud(x, y, s, pal, o) {
  const p = (dx, dy, r) =>
    `<circle cx="${(x + dx * s).toFixed(0)}" cy="${(y + dy * s).toFixed(0)}" r="${(r * s).toFixed(1)}"/>`;
  return `<g class="vs-cloud" opacity="${o}">
    <g fill="${pal.cloud}" stroke="${VS_INK}" stroke-width="${(1.7 * s).toFixed(1)}" stroke-linejoin="round">
      ${p(-46, 4, 21)}${p(-20, -10, 27)}${p(12, -18, 31)}${p(44, -6, 23)}${p(66, 6, 17)}${p(-66, 10, 15)}
      <ellipse cx="${x}" cy="${(y + 13 * s).toFixed(0)}" rx="${(84 * s).toFixed(0)}" ry="${(17 * s).toFixed(0)}"/>

/* ---------- трава: короткие штрихи ---------- */
function artBlades(from, to, col, n, base, hMin, hMax, seed) {
  let out = '';
  for (let i = 0; i < n; i++) {
    const t = i / n;
    const x = from + (to - from) * t + Math.sin(i * 7.1 + seed) * 10;
    const h = hMin + Math.abs(Math.cos(i * 3.7 + seed)) * (hMax - hMin);
    const lean = Math.sin(i * 2.3 + seed) * 4;
    out += `<path class="vs-blade" d="M${x.toFixed(0)} ${base} l${lean.toFixed(1)} ${(-h).toFixed(1)}"
      stroke="${col}" stroke-width="${(2 + (i % 3) * .4).toFixed(1)}" fill="none" stroke-linecap="round"/>
      <path class="vs-blade" d="M${(x + 5).toFixed(0)} ${base} l${(-lean).toFixed(1)} ${(-h * .75).toFixed(1)}"
      stroke="${col}" stroke-width="${(1.8 + (i % 2) * .4).toFixed(1)}" fill="none" stroke-linecap="round" opacity=".8"/>`;
  }
  return out;
}

<script>
/* ============================================================
   Авторизация, синхронизация прогресса и учительская панель
   ============================================================ */

const Auth = (() => {
  let user = null;          // {id, username, display_name, role}
  let myGrade = null;       // {grade, comment, updated_at}
  let online = false;       // доступен ли сервер
  let hasUsers = false;     // есть ли аккаунты на сервере
  let syncTimer = null;
  let pending = null;
  let lastSync = 0;
  let serverUpdated = 0;   // версия прогресса на сервере (для защиты от затирания)
  let conflictRetries = 0;

  const ROLE_RU = { owner: 'Владелец', teacher: 'Учитель', student: 'Ученик' };
  const TOKEN_KEY = 'zh_token';

  function getToken() {
    try { return (window.Store ? window.Store.get(TOKEN_KEY) : null) || null; } catch (e) { return null; }
  }
  function setToken(t) {
    try { if (window.Store) window.Store.set(TOKEN_KEY, t || ''); } catch (e) { }
  }

  /* ---------- сеть ----------
     credentials: 'omit' + заголовок Authorization — работает и из обычного
     браузера, и из iframe с непрозрачным origin (там cookies недоступны). */
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    const t = getToken();
    if (t) headers.Authorization = 'Bearer ' + t;
    const res = await fetch(path, {
      credentials: 'omit',
      ...opts,
      headers: { ...headers, ...(opts.headers || {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    let data = {};
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) {
      const err = new Error(data.error || res.status);
      err.status = res.status;
      err.data = data;
      if (res.status === 401) onSessionLost();
      throw err;
    }
    return data;
  }

  /* Сессия истекла или отозвана. Раньше это проходило незаметно: интерфейс
     продолжал показывать «вы вошли», а каждое сохранение тихо проваливалось.
     Локальный прогресс при этом не теряется — он остаётся в браузере. */
  function onSessionLost() {
    if (!getToken() && !user) return;
    setToken('');
    user = null;
    myGrade = null;
    serverUpdated = 0;
    conflictRetries = 0;
    try {
      if (typeof window !== 'undefined' && window.dispatchEvent) {
        window.dispatchEvent(new CustomEvent('auth:expired'));
      }
    } catch (e) { }
  }

  /* ---------- перехват ошибок браузера ---------- */
  let errCountWindow = 0;
  setInterval(() => { errCountWindow = 0; }, 60000);
  function reportClientError(message, detail) {
    if (!online || !message || errCountWindow >= 6) return;
    errCountWindow++;
    try {
      const headers = { 'Content-Type': 'application/json' };
      const t = getToken();
      if (t) headers.Authorization = 'Bearer ' + t;
      fetch('/api/system/client-error', {
        method: 'POST', credentials: 'omit', headers,
        body: JSON.stringify({ message: String(message).slice(0, 350), detail: String(detail || '').slice(0, 1500) })
      }).catch(() => { });
    } catch (e) { }
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('error', (ev) => {
      if (ev && ev.message) reportClientError(ev.message, `${ev.filename || ''}:${ev.lineno || ''}:${ev.colno || ''}`);
    });
    window.addEventListener('unhandledrejection', (ev) => {
      const r = ev && ev.reason;
      const msg = (r && (r.message || String(r))) || 'Unhandled rejection';
      reportClientError(msg, r && r.stack ? r.stack : '');
    });
  }

  /* ---------- запуск ---------- */
  let serverBuild = '';

  /* Версия этой страницы — метка, которую вписал build.py при сборке. */
  function pageBuild() {
    try {
      const m = document.querySelector('meta[name="app-build"]');
      return (m && m.getAttribute('content')) || '';
    } catch (e) { return ''; }
  }

  /* Браузер мог открыть старую страницу из кэша. Если сервер отдаёт другую
     сборку — предупреждаем и даём кнопку «Обновить» (одна, чтобы не мешать). */
  function checkBuildFreshness() {
    const mine = pageBuild();
    if (!mine || !serverBuild || mine === serverBuild) return;
    /* Дети не читают баннеры: если увидели устаревшую копию — перезагружаемся
       сами, один раз за сессию (иначе гонка, если сервер отдаёт старое). */
    try {
      const key = 'zh_reloaded_' + serverBuild;
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, '1');
        hardReload();
        return;
      }
    } catch (e) { /* приватный режим — остаётся баннер */ }
    if (document.getElementById('buildOutdated')) return;
    const bar = document.createElement('div');
    bar.id = 'buildOutdated';
    bar.className = 'frame-banner build-outdated';
    bar.innerHTML = `<span>🔄 <b>Доступна новая версия программы.</b> Вы смотрите сохранённую копию (${mine}), на сервере уже ${serverBuild}.</span>`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm btn-primary';
    btn.textContent = 'Обновить';
    btn.onclick = () => {
      btn.disabled = true;
      btn.textContent = 'Обновляем…';
      hardReload();
    };
    bar.appendChild(btn);
    document.body.prepend(bar);
  }

  /* Полная перезагрузка в обход кэша браузера. */
  function hardReload() {
    try {
      const url = new URL(location.href);
      url.searchParams.set('v', (serverBuild || Date.now().toString(36)));
      location.replace(url.toString());
    } catch (e) {
      location.reload();
    }
  }

  /* Лёгкая проверка версии без полной перезагрузки состояния. */
  async function checkBuild() {
    if (!online) return;
    try {
      const st = await api('/api/auth/status');
      serverBuild = st.build || '';
      checkBuildFreshness();
    } catch (e) { }
  }

  async function boot() {
    try {
      const st = await api('/api/auth/status');
      online = true;
      hasUsers = !!st.has_users;
      serverBuild = st.build || '';
      checkBuildFreshness();
    } catch (e) {
      online = false;
      hasUsers = false;
    }
    if (online) {
      try {
        const me = await api('/api/auth/me');
        user = me.user;
        myGrade = me.grade || null;
        await pullProgress();
      } catch (e) { user = null; myGrade = null; }
    }
    return { user, online, hasUsers };
  }

  function needsAuth() { return online && hasUsers && !user; }

  /* ---------- вход / регистрация ---------- */
  async function login(username, password) {
    const r = await api('/api/auth/login', { method: 'POST', body: { username, password } });
    user = r.user;
    hasUsers = true;
    if (r.token) setToken(r.token);
    serverUpdated = 0; conflictRetries = 0;
    try { const me = await api('/api/auth/me'); myGrade = me.grade || null; } catch (e) { myGrade = null; }
    await pullProgress();
    return user;
  }

  async function register({ code, display_name, username, password }) {
    const r = await api('/api/auth/register', { method: 'POST', body: { code, display_name, username, password } });
    user = r.user;
    myGrade = null;
    hasUsers = true;
    if (r.token) setToken(r.token);
    serverUpdated = 0; conflictRetries = 0;
    await pullProgress();
    return user;
  }

  async function changePassword(current, next) {
    return api('/api/auth/password', { method: 'POST', body: { current, new: next } });
  }

  async function logout() {
    try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) { }
    setToken('');
    user = null;
    myGrade = null;
  }

  /* ---------- синхронизация прогресса ---------- */
  async function pullProgress() {
    if (!user) return;
    try {
      const r = await api('/api/progress');
      serverUpdated = Number(r.updated_at) || 0;
      const server = (r.payload && typeof r.payload === 'object' && !Array.isArray(r.payload))
        ? r.payload : {};
      const local = window.__state ? window.__state() : null;
      const serverHas = Object.keys(server.lessons || {}).length > 0;
      const localHas = !!local && Object.keys(local.lessons || {}).length > 0;

      if (!serverHas && localHas) {
        // Локально есть, на сервере пусто — отправляем локальное.
        persist(true);
      } else if (serverHas && !localHas) {
        window.__setState(Object.assign({}, local || {}, server));
      } else if (serverHas && localHas) {
        // Оба непустые: объединяем, а не перезаписываем — иначе занятия
        // на телефоне и компьютере стирали бы друг друга.
        const before = JSON.stringify(local);
        if (window.__mergeProgress) window.__mergeProgress(server);
        if (window.__state && JSON.stringify(window.__state()) !== before) persist(true);
      }
    } catch (e) { /* останется локально */ }
  }

  function persist(immediate = false) {
    if (!user || !online) return;
    clearTimeout(syncTimer);
    const send = () => {
      const payload = window.__state ? window.__state() : null;
      if (!payload) return;
      pending = payload;
      api('/api/progress', { method: 'PUT', body: { payload, base_updated: serverUpdated } })
        .then((r) => {
          lastSync = Date.now();
          pending = null;
          conflictRetries = 0;
          serverUpdated = Number(r && r.updated_at) || serverUpdated;
        })
        .catch((err) => {
          // 401 уже обработан в api().
          if (err && err.status === 401) return;
          if (err && err.status === 409 && err.data && err.data.payload) {
            // Другое устройство сохранило новее: объединяем и повторяем.
            if (window.__mergeProgress) window.__mergeProgress(err.data.payload);
            serverUpdated = Number(err.data.updated_at) || serverUpdated;
            if (++conflictRetries <= 3) {
              clearTimeout(syncTimer);
              syncTimer = setTimeout(send, 300);
            }
            return;
          }
          // Сеть или сервер: повторяем позже, чтобы прогресс не осел
          // только в браузере.
          clearTimeout(syncTimer);
          syncTimer = setTimeout(send, 5000);
        });
    };
    if (immediate) send(); else syncTimer = setTimeout(send, 1200);
  }

  /* ============================================================
     ЭКРАН ВХОДА
     ============================================================ */
  function renderAuth(root) {
    const wrap = document.createElement('div');
    wrap.className = 'auth-wrap';

    let mode = hasUsers ? 'login' : 'register';

    const card = document.createElement('div');
    card.className = 'panel auth-card';
    wrap.appendChild(card);
    root.appendChild(wrap);

    function paint() {
      card.innerHTML = '';
      const head = document.createElement('div');
      head.className = 'auth-head';
      head.innerHTML = `
        <div class="auth-logo">学</div>
        <h1>汉语学习</h1>
        <p>${hasUsers ? 'Войдите, чтобы прогресс сохранялся и учитель видел ваши результаты'
          : 'Вы первый пользователь — регистрация даст вам роль <b>владельца</b> (учителя)'}</p>`;
      card.appendChild(head);

      if (!online) {
        const isFilePreview = (location.protocol !== 'http:' && location.protocol !== 'https:');
        const warn = document.createElement('div');
        warn.className = 'auth-warn';
        warn.innerHTML = isFilePreview
          ? '⚠️ <b>Открыт просмотр файла без сети.</b> В этом окне нет связи с сервером — вход и панель класса работают только в <b>Live Preview</b> (адрес на порту <code>8080</code>). Вы можете нажать «Продолжить без аккаунта», чтобы заниматься локально.'
          : '⚠️ Сервер недоступен — работает <b>локальный режим</b>. Проверьте, запущен ли сервер, или нажмите «Продолжить без аккаунта».';
        card.appendChild(warn);
      }

      const tabs = document.createElement('div');
      tabs.className = 'tabs';
      if (hasUsers) {
        [['login', '🔑 Вход'], ['register', '📝 Регистрация по коду']].forEach(([id, t]) => {
          const b = document.createElement('button');
          b.className = 'tab' + (mode === id ? ' active' : '');
          b.textContent = t;
          b.onclick = () => { mode = id; paint(); };
          tabs.appendChild(b);
        });
        card.appendChild(tabs);
      }

      const form = document.createElement('form');
      form.className = 'auth-form';
      const err = document.createElement('div');
      err.className = 'auth-error';
      err.style.display = 'none';

      const field = (label, name, type = 'text', placeholder = '') => {
        const wrapf = document.createElement('label');
        wrapf.className = 'field';
        wrapf.innerHTML = `<span>${label}</span>`;
        const inp = document.createElement('input');
        inp.type = type; inp.name = name; inp.placeholder = placeholder; inp.autocomplete = type === 'password' ? 'current-password' : 'off';
        wrapf.appendChild(inp);
        return { wrap: wrapf, inp };
      };

      let fUser, fPass, fCode, fName;

      if (mode === 'login') {
        fUser = field('Логин или имя', 'username', 'text', 'например ali01 или Али');
        fPass = field('Пароль', 'password', 'password', '••••••');
        form.appendChild(fUser.wrap); form.appendChild(fPass.wrap);
      } else {
        fCode = hasUsers
          ? field('Код от учителя', 'code', 'text', 'ABC-123')
          : field('Код от учителя (не нужен — вы первый)', 'code', 'text', 'оставьте пустым');
        fName = field('Ваше имя', 'display_name', 'text', 'Али');
        fUser = field('Логин (необязательно)', 'username', 'text', 'придумайте или оставьте пустым');
        fPass = field('Пароль (минимум 8 символов)', 'password', 'password', '••••••');
        fPass.inp.minLength = 8;
        if (!hasUsers) {
          const tip = document.createElement('div');
          tip.className = 'auth-warn';
          tip.innerHTML = '👑 <b>Вы — первый пользователь.</b> Регистрация даст вам роль владельца: вы увидите весь класс, сможете создавать учеников и выставлять оценки.';
          form.appendChild(tip);
        }
        form.appendChild(fCode.wrap); form.appendChild(fName.wrap);
        form.appendChild(fUser.wrap); form.appendChild(fPass.wrap);
      }
      card.appendChild(err);
      card.appendChild(form);

      const btn = document.createElement('button');
      btn.className = 'btn btn-primary auth-submit';
      btn.textContent = mode === 'login' ? 'Войти →' : 'Создать аккаунт →';
      btn.type = 'submit';
      form.appendChild(btn);

      form.onsubmit = async (e) => {
        e.preventDefault();
        err.style.display = 'none';
        if (!online) {
          // попробуем ещё раз проверить сервер перед отказом
          try {
            const st = await api('/api/auth/status');
            online = true;
            hasUsers = !!st.has_users;
          } catch (_) {
            err.textContent = (location.protocol !== 'http:' && location.protocol !== 'https:')
              ? 'Нет связи с сервером: вы смотрите статический файл. Откройте приложение через Live Preview (порт 8080).'
              : 'Сервер недоступен. Обновите страницу или проверьте подключение.';
            err.style.display = 'block';
            return;
          }
        }
        btn.disabled = true;
        btn.textContent = 'Подождите…';
        try {
          if (mode === 'login') {
            await login(fUser.inp.value.trim(), fPass.inp.value);
          } else {
            if (fPass.inp.value.length < 8) {
              throw new Error('weak_password');
            }
            await register({
              code: fCode.inp.value.trim(),
              display_name: fName.inp.value.trim(),
              username: fUser.inp.value.trim(),
              password: fPass.inp.value
            });
          }
          window.__afterAuth();
        } catch (ex) {
          const map = {
            bad_credentials: 'Неверный логин или пароль',
            bad_invite: 'Код не найден или уже использован',
            name_required: 'Введите имя (минимум 2 символа)',
            weak_password: 'Пароль слишком короткий (минимум 8 символов)',
            bad_password: 'Текущий пароль указан неверно',
            password_too_long: 'Пароль слишком длинный (максимум 256 символов)',
            cannot_touch_owner: 'Владельца аккаунта изменить нельзя',
            too_many: 'Слишком много попыток. Подождите 5 минут.',
            not_authenticated: 'Сессия истекла — войдите заново'
          };
          err.textContent = map[ex.message] || ('Ошибка: ' + ex.message);
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = mode === 'login' ? 'Войти →' : 'Создать аккаунт →';
        }
      };

      const guest = document.createElement('button');
      guest.className = 'btn btn-ghost auth-guest';
      guest.textContent = 'Продолжить без аккаунта (локально)';
      guest.onclick = () => { window.__guestMode(); };
      card.appendChild(guest);
    }
    paint();
  }

  /* ============================================================
     УЧИТЕЛЬСКАЯ ПАНЕЛЬ
     ============================================================ */
  async function renderClass(root) {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<h1 class="page-title">👨‍🏫 Класс</h1><p class="page-sub">Загрузка…</p>';
    root.appendChild(wrap);

    let tab = 'class'; // 'class' | 'system'
    let data, invites = [], sys = null;
    async function loadData() {
      const reqs = [
        api('/api/class/overview'),
        api('/api/class/invites').catch(() => ({ invites: [] }))
      ];
      if (user?.role === 'owner') reqs.push(api('/api/system/status').catch(() => null));
      const [ov, iv, sy] = await Promise.all(reqs);
      data = ov;
      invites = (iv.invites || []).filter(i => !i.used_by);
      if (sy !== undefined) sys = sy;
    }
    try {
      await loadData();
    } catch (e) {
      wrap.innerHTML = '<h1 class="page-title">👨‍🏫 Класс</h1><div class="panel">Нет доступа или сервер недоступен.</div>';
      return;
    }

    async function reload() {
      try { await loadData(); paint(); } catch (e) { paint(); }
    }

    const paint = () => {
      wrap.innerHTML = '';
      wrap.appendChild(el2('h1', 'page-title', `👨‍🏫 Класс — ${ROLE_RU[user?.role] || 'Учитель'}`));
      wrap.appendChild(el2('p', 'page-sub',
        `Учеников: ${data.count} · средний балл класса: ${data.avg_score}% · средняя точность: ${data.avg_accuracy}% · активны сегодня: ${data.active_today}`));

      {
        const tabs = el2('div', 'tabs');
        const errN = sys?.counts?.errors || 0;
        const onN = data.online_count || 0;
        [['live', `🟢 Кто онлайн${onN ? ` (${onN})` : ''}`], ['class', '📋 Ученики и коды'], ['hw', '🏠 Домашки'], ['system', `🛠 Состояние системы${errN ? ` (${errN})` : ''}`]].forEach(([id, label]) => {
          const b = el2('button', 'tab' + (tab === id ? ' active' : ''), label);
          b.onclick = () => { tab = id; paint(); };
          tabs.appendChild(b);
        });
        wrap.appendChild(tabs);
      }

      if (tab === 'live') {
        paintLive();
        /* Пока вкладка открыта, обновляем список сам: «сейчас на сайте»
           устаревает за минуты, а нажимать «обновить» никто не будет. */
        if (!window.__liveTimer) {
          window.__liveTimer = setInterval(async () => {
            if (tab !== 'live' || !document.body.contains(wrap)) {
              clearInterval(window.__liveTimer); window.__liveTimer = null; return;
            }
            try { await loadData(); paint(); } catch (e) { }
          }, 30000);
        }
        return;
      }
      if (tab === 'hw') {
        paintHomework();
        return;
      }
      if (tab === 'system' && user?.role === 'owner') {
        paintSystem();
        return;
      }

      /* --- приглашения --- */
      const inv = el2('div', 'panel');
      inv.appendChild(el2('h3', '', '🔑 Коды для учеников'));
      inv.appendChild(el2('p', 'page-sub', 'Создайте код, отправьте ученику. Он введёт код при регистрации, выберет имя и пароль.'));
      const btnRow = el2('div', 'btn-row');
      const mk = el2('button', 'btn btn-primary', '＋ Создать код');
      const csv = el2('button', 'btn btn-ghost', '⬇ Экспорт CSV');
      csv.onclick = async () => {
        try {
          const headers = {};
          const t = getToken();
          if (t) headers.Authorization = 'Bearer ' + t;
          const res = await fetch('/api/class/export.csv', { credentials: 'omit', headers });
          if (!res.ok) throw new Error(res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'klass.csv';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) { toast('Ошибка экспорта'); }
      };
      btnRow.appendChild(mk); btnRow.appendChild(csv);
      inv.appendChild(btnRow);
      const codeBox = el2('div', 'code-list');
      const addCodeRow = (code, whenText) => {
        const c = el2('div', 'code-item');
        c.innerHTML = `<b>${esc(code)}</b><span>${esc(whenText)}</span>`;
        const copy = el2('button', 'btn btn-sm', '📋 Копировать');
        copy.onclick = () => { navigator.clipboard?.writeText(code); toast('Код скопирован'); };
        const rev = el2('button', 'btn btn-sm', 'Отозвать');
        rev.onclick = async () => { await api('/api/class/invites/revoke', { method: 'POST', body: { code } }); reload(); };
        c.appendChild(copy); c.appendChild(rev);
        codeBox.appendChild(c);
      };
      invites.forEach(i => addCodeRow(i.code, 'активен · ' + timeAgo(i.created_at)));
      inv.appendChild(codeBox);
      mk.onclick = async () => {
        try {
          const r = await api('/api/class/invite', { method: 'POST', body: {} });
          toast('Код создан: ' + r.code);
          await reload();
        } catch (e) { toast('Ошибка'); }
      };
      wrap.appendChild(inv);

      /* --- таблица учеников --- */
      const t = el2('div', 'panel');
      t.appendChild(el2('h3', '', `📋 Ученики (${data.count})`));
      if (!data.students.length) {
        t.appendChild(el2('div', 'empty', 'Пока нет учеников. Создайте код выше и отправьте его ученикам.'));
      } else {
        const table = el2('div', 'student-table');
        table.appendChild(el2('div', 'st-row st-head', `
          <span>Ученик</span><span>Уроки</span><span>Балл</span><span>Точность</span>
          <span>Карточки</span><span>Дней</span><span>Активность</span><span>Оценка</span><span></span>`));
        data.students.forEach(s => {
          const row = el2('div', 'st-row');
          row.innerHTML = `
            <span class="st-name"><b>${esc(s.display_name)}</b><i>@${esc(s.username)}</i></span>
            <span>${s.lessons_done}/${s.lessons_total}</span>
            <span class="${s.avg_score >= 80 ? 'ok' : s.avg_score >= 50 ? 'mid' : 'bad'}">${s.avg_score}%</span>
            <span>${s.accuracy}%</span>
            <span>${s.cards}</span>
            <span>${s.streak}</span>
            <span class="st-when">${s.active_today ? 'сегодня' : timeAgo(s.last_active)}</span>
            <span class="st-grade">${s.grade ? esc(s.grade) : '—'}</span>
            <span class="st-acts"></span>`;
          const acts = row.querySelector('.st-acts');
          const view = el2('button', 'btn btn-sm', '👁');
          view.onclick = () => openStudent(s.id, reload);
          const grade = el2('button', 'btn btn-sm', '✍️');
          grade.onclick = () => openStudent(s.id, reload, true);
          acts.appendChild(view); acts.appendChild(grade);
          table.appendChild(row);
        });
        t.appendChild(table);
      }
      wrap.appendChild(t);
    };

    /* --- домашки: проверка --- */
    let hwCache = null;
    async function paintHomework() {
      const panel = el2('div', 'panel');
      panel.appendChild(el2('h3', '', '🏠 Домашние задания учеников'));
      panel.appendChild(el2('p', 'page-sub',
        'Работы, которые ученики выполнили и отправили на сайте. Красным — ждут проверки.'));
      wrap.appendChild(panel);

      if (!hwCache) {
        try { hwCache = await api('/api/class/homework'); } catch (e) { hwCache = null; }
      }
      if (!hwCache) {
        panel.appendChild(el2('div', 'empty', 'Не удалось загрузить домашки.'));
        return;
      }
      const head = el2('div', 'btn-row');
      const info = el2('span', 'page-sub',
        `Всего работ: ${hwCache.total} · проверено: ${hwCache.graded}` +
        (hwCache.avg != null ? ` · средний балл: ${hwCache.avg}%` : ''));
      const refresh = el2('button', 'btn btn-sm btn-ghost', '↻ Обновить');
      refresh.onclick = async () => { hwCache = null; tab = 'hw'; paint(); };
      head.appendChild(refresh);
      head.appendChild(info);
      panel.appendChild(head);

      if (!hwCache.items.length) {
        panel.appendChild(el2('div', 'empty', 'Пока никто не отправил домашку.'));
        return;
      }

      const list = el2('div', 'hw-teach');
      hwCache.items.forEach(it => {
        const waiting = it.score == null;
        const row = el2('div', 'hw-teach-row' + (waiting ? ' waiting' : ''));
        const title = (window.LESSONS && window.LESSONS[it.lesson_id]?.title) || it.lesson_id;
        row.innerHTML = `
          <span><b>${esc(it.student)}</b><br><i>@${esc(it.username)}</i></span>
          <span>${esc(title)}<br><i>${Object.keys(it.answers || {}).length} ответов · ${timeAgo(it.updated_at)}</i></span>
          <span class="st-grade">${waiting ? '⏳ ждёт' : it.score + '%'}</span>
          <span><i>${it.feedback ? esc(it.feedback.slice(0, 40)) : '—'}</i></span>
          <span class="st-acts"></span>`;
        const acts = row.querySelector('.st-acts');
        const open = el2('button', 'btn btn-sm btn-primary', waiting ? 'Проверить' : 'Открыть');
        open.onclick = () => openHomework(it, async () => { hwCache = null; tab = 'hw'; paint(); });
        acts.appendChild(open);
        list.appendChild(row);
      });
      panel.appendChild(list);
    }

    /* Карточка работы: все ответы ученика и выставление оценки. */
    function openHomework(it, refresh) {
      const tasks = (window.homeworkFor ? window.homeworkFor(it.lesson_id) : []);
      const title = (window.LESSONS && window.LESSONS[it.lesson_id]?.title) || it.lesson_id;
      const ov = document.createElement('div');
      ov.className = 'overlay';
      const modal = document.createElement('div');
      modal.className = 'panel modal';
      const rows = tasks.map((task, i) => {
        const raw = it.answers['hw' + i];
        let shown = raw;
        if ((task.k === 'mcq' || task.k === 'read') && raw !== undefined) {
          const idx = Number(raw);
          const chosen = (task.o || [])[idx] || '—';
          const mark = idx === task.a ? '✅' : '❌';
          shown = `${mark} ${chosen}` + (idx === task.a ? '' : `   (верно: ${(task.o || [])[task.a] || '—'})`);
        }
        if (task.k === 'order' && raw) {
          const words = String(raw).split(',').filter(Boolean).map(x => (task.o || [])[Number(x)] || '').join(' ');
          shown = words;
        }
        return `<div class="hw-answer">
            <div class="aq">${i + 1}. ${esc(task.q)}</div>
            <div class="aa ${shown ? '' : 'empty-ans'}">${shown ? esc(shown) : 'нет ответа'}</div>
          </div>`;
      }).join('');

      modal.innerHTML = `
        <div class="modal-head"><h2>${esc(it.student)} · ${esc(title)}</h2>
        <button class="modal-x" aria-label="Закрыть">✕</button></div>
        <p class="page-sub">Отправлено ${timeAgo(it.updated_at)}${it.graded_at ? ' · проверено ' + timeAgo(it.graded_at) : ''}</p>
        <div class="hw-answers">${rows || '<div class="empty">Заданий не найдено</div>'}</div>
        <h3>Оценка работы</h3>
        <div class="hw-graded-box">
          <input class="g-input hw-score" type="number" min="0" max="100" placeholder="0–100"
                 value="${it.score == null ? '' : it.score}">
          <input class="g-input wide hw-fb" placeholder="Комментарий для ученика"
                 value="${esc(it.feedback || '')}">
          <button class="btn btn-primary hw-save">Сохранить оценку</button>
        </div>
        <div class="hw-note">Ученик увидит оценку и комментарий в разделе «Домашки» и на странице урока.</div>`;
      ov.appendChild(modal);
      root.appendChild(ov);
      const close = () => ov.remove();
      modal.querySelector('.modal-x').onclick = close;
      ov.onclick = e => { if (e.target === ov) close(); };
      modal.querySelector('.hw-save').onclick = async () => {
        const score = parseInt(modal.querySelector('.hw-score').value, 10);
        if (!(score >= 0 && score <= 100)) { toast('Оценка — число от 0 до 100'); return; }
        const feedback = modal.querySelector('.hw-fb').value.trim();
        try {
          await api('/api/class/homework/grade', {
            method: 'POST',
            body: { student_id: it.student_id, lesson_id: it.lesson_id, score, feedback }
          });
          toast('Оценка сохранена');
          close();
          refresh();
        } catch (e) { toast('Не удалось сохранить'); }
      };
    }

    function fmtDur(sec) {
      sec = Math.max(0, Number(sec || 0));
      if (sec < 60) return sec + ' сек';
      if (sec < 3600) return Math.floor(sec / 60) + ' мин';
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      return h + ' ч ' + m + ' мин';
    }
    function fmtBytes(b) {
      b = Number(b || 0);
      if (b < 1024) return b + ' Б';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' КБ';
      return (b / (1024 * 1024)).toFixed(2) + ' МБ';
    }

    /* --- Кто сейчас на сайте ---
       Учителю важно видеть не только оценки, но и кто реально заходит:
       «активен 2 минуты назад» или «не заходил неделю». Данные берём из
       отметок сессий на сервере (не чаще раза в минуту на человека). */
    function paintLive() {
      const on = data.online || [];
      const win = Math.round((data.online_window_sec || 300) / 60);

      const head = el2('div', 'panel');
      head.appendChild(el2('h3', '', '🟢 Кто сейчас на сайте'));
      head.appendChild(el2('p', 'page-sub',
        `Считается активным, если заходил за последние ${win} мин. Всего в классе: ${data.count}.`));

      const grid = el2('div', 'stat-grid');
      const activeToday = (data.students || []).filter(s => s.active_today).length;
      const gone = (data.students || []).filter(s => s.last_seen && (data.server_time - s.last_seen) > 86400 * 7).length;
      grid.innerHTML = `
        <div><b class="ok">${on.length}</b><span>сейчас на сайте</span></div>
        <div><b>${activeToday}</b><span>занимались сегодня</span></div>
        <div><b>${data.count}</b><span>учеников в классе</span></div>
        <div><b class="${gone ? 'bad' : 'ok'}">${gone}</b><span>не заходят 7+ дней</span></div>`;
      head.appendChild(grid);

      /* список тех, кто онлайн */
      const livePanel = el2('div', 'panel');
      livePanel.appendChild(el2('h3', '', 'Сейчас в приложении'));
      if (!on.length) {
        livePanel.appendChild(el2('div', 'empty', 'Сейчас никого нет. Загляните позже — список обновляется сам.'));
      } else {
        const ul = el2('div', 'live-list');
        on.forEach(p => {
          const row = el2('div', 'live-row');
          row.innerHTML = `<span class="live-dot"></span>
            <span class="live-name"><b>${esc(p.display_name)}</b>
              <i>${p.role === 'owner' ? 'владелец' : p.role === 'teacher' ? 'учитель' : 'ученик'}</i></span>
            <span class="live-when">${timeAgo(p.seen)}</span>`;
          ul.appendChild(row);
        });
        livePanel.appendChild(ul);
      }
      const rf = el2('button', 'btn btn-sm btn-ghost', '↻ Обновить');
      rf.onclick = () => reload();
      livePanel.appendChild(rf);
      wrap.appendChild(livePanel);

      /* занятия по дням: столбики за две недели */
      const days = data.days || [];
      if (days.length) {
        const chart = el2('div', 'panel');
        chart.appendChild(el2('h3', '', '📈 Заходы за две недели'));
        chart.appendChild(el2('p', 'page-sub', 'Сколько учеников заходило в приложение каждый день.'));
        const max = Math.max(1, ...days.map(d => d.users));
        const bars = el2('div', 'days-chart');
        days.forEach(d => {
          const col = el2('div', 'day-col');
          const h = Math.round((d.users / max) * 100);
          col.innerHTML = `<div class="day-bar${d.users ? '' : ' off'}" style="height:${Math.max(6, h)}%"
              title="${d.users} чел."></div>
            <span class="day-num">${d.users || ''}</span>
            <span class="day-lbl">${new Date(d.day * 1000).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })}</span>`;
          bars.appendChild(col);
        });
        chart.appendChild(bars);
        wrap.appendChild(chart);
      }

      /* кто давно не заходил — сюда учитель смотрит в первую очередь */
      const absent = (data.students || [])
        .filter(s => !s.online)
        .sort((a, b) => (a.last_seen || 0) - (b.last_seen || 0))
        .slice(0, 8);
      const miss = el2('div', 'panel');
      miss.appendChild(el2('h3', '', '⏰ Давно не заходили'));
      if (!absent.length) {
        miss.appendChild(el2('div', 'empty', 'Все ученики на месте.'));
      } else {
        const table = el2('div', 'live-list');
        absent.forEach(s => {
          const row = el2('div', 'live-row');
          const late = s.last_seen && (data.server_time - s.last_seen) > 86400 * 3;
          row.innerHTML = `<span class="live-dot off"></span>
            <span class="live-name"><b>${esc(s.display_name)}</b><i>уроков: ${s.lessons_done}/${s.lessons_total}</i></span>
            <span class="live-when ${late ? 'bad' : ''}">${s.last_seen ? timeAgo(s.last_seen) : 'ещё не заходил'}</span>`;
          miss.appendChild(row);
        });
      }
      wrap.appendChild(miss);
    }

    function paintSystem() {
      const sp = el2('div', 'panel');
      sp.appendChild(el2('h3', '', '🖥 Состояние сервера и базы данных'));
      if (!sys) {
        sp.appendChild(el2('div', 'empty', 'Не удалось получить статус сервера.'));
        wrap.appendChild(sp);
        return;
      }
      const c = sys.counts || {};
      const grid = el2('div', 'stat-grid');
      grid.innerHTML = `
        <div><b class="ok">Работает ✓</b><span>сервер (Python ${esc(sys.python_version)})</span></div>
        <div><b>${fmtDur(sys.uptime_sec)}</b><span>время работы</span></div>
        <div><b>${fmtBytes(sys.db_size_bytes)}</b><span>размер базы app.db</span></div>
        <div><b>${c.users || 0}</b><span>пользователей (${c.students || 0} уч.)</span></div>
        <div><b>${c.sessions_active || 0}</b><span>активных сессий</span></div>
        <div><b class="${(c.errors || 0) ? 'bad' : 'ok'}">${c.errors || 0}</b><span>ошибок в журнале</span></div>
        <div><b>${esc(sys.build || '—')}</b><span>версия сборки на сервере</span></div>
        <div><b>${esc(pageBuild() || '—')}</b><span>версия страницы в браузере</span></div>`;
      sp.appendChild(grid);

      const act = el2('div', 'btn-row');
      const bk = el2('button', 'btn btn-primary', '💾 Скачать резервную копию (app.db)');
      bk.onclick = async () => {
        try {
          const headers = {};
          const t = getToken();
          if (t) headers.Authorization = 'Bearer ' + t;
          const res = await fetch('/api/system/backup', { credentials: 'omit', headers });
          if (!res.ok) throw new Error(res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');

      wrap.appendChild(ep);
    }

    /* --- карточка ученика --- */
    /* Временный пароль: без похожих символов (0/O, 1/l/I), чтобы его
       можно было продиктовать ученику без ошибок. */
    function genTempPassword(len = 10) {
      const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
      let out = '';
      const buf = new Uint32Array(len);
      if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(buf);
      else for (let i = 0; i < len; i++) buf[i] = Math.floor(Math.random() * 1e9);
      for (let i = 0; i < len; i++) out += abc[buf[i] % abc.length];
      return out;
    }

    async function openStudent(id, refresh, focusGrade = false) {
      let d;
      try { d = await api('/api/class/students/' + id); } catch (e) { toast('Не удалось загрузить'); return; }
      const ov = document.createElement('div');
      ov.className = 'overlay';
      const modal = document.createElement('div');
      modal.className = 'panel modal';
      const s = d.summary;
      modal.innerHTML = `

        <div class="stat-grid">
          <div><b>${s.lessons_done}/${s.lessons_total}</b><span>уроков</span></div>
          <div><b>${s.avg_score}%</b><span>средний балл</span></div>
