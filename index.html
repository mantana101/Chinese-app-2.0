<script>
/* ============================================================
   Авторизация, синхронизация прогресса и учительская панель
   ============================================================ */

const Auth = (() => {
  let user = null;          // {id, username, display_name, role}
  let myGrade = null;       // {grade, comment, updated_at}
  let online = false;       // доступен ли сервер
  let hasUsers = false;     // есть ли аккаунты на сервере
  let syncTimer = null;
  let pending = null;
  let lastSync = 0;
  let serverUpdated = 0;   // версия прогресса на сервере (для защиты от затирания)
  let conflictRetries = 0;

  const ROLE_RU = { owner: 'Владелец', teacher: 'Учитель', student: 'Ученик' };
  const TOKEN_KEY = 'zh_token';

  function getToken() {
    try { return (window.Store ? window.Store.get(TOKEN_KEY) : null) || null; } catch (e) { return null; }
  }
  function setToken(t) {
    try { if (window.Store) window.Store.set(TOKEN_KEY, t || ''); } catch (e) { }
  }

  /* ---------- сеть ----------
     credentials: 'omit' + заголовок Authorization — работает и из обычного
     браузера, и из iframe с непрозрачным origin (там cookies недоступны). */
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    const t = getToken();
    if (t) headers.Authorization = 'Bearer ' + t;
    const res = await fetch(path, {
      credentials: 'omit',
      ...opts,
      headers: { ...headers, ...(opts.headers || {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    let data = {};
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) {
      const err = new Error(data.error || res.status);
      err.status = res.status;
      err.data = data;
      if (res.status === 401) onSessionLost();
      throw err;
    }
    return data;
  }

  /* Сессия истекла или отозвана. Раньше это проходило незаметно: интерфейс
     продолжал показывать «вы вошли», а каждое сохранение тихо проваливалось.
     Локальный прогресс при этом не теряется — он остаётся в браузере. */
  function onSessionLost() {
    if (!getToken() && !user) return;
    setToken('');
    user = null;
    myGrade = null;
    serverUpdated = 0;
    conflictRetries = 0;
    try {
      if (typeof window !== 'undefined' && window.dispatchEvent) {
        window.dispatchEvent(new CustomEvent('auth:expired'));
      }
    } catch (e) { }
  }

  /* ---------- перехват ошибок браузера ---------- */
  let errCountWindow = 0;
  setInterval(() => { errCountWindow = 0; }, 60000);
  function reportClientError(message, detail) {
    if (!online || !message || errCountWindow >= 6) return;
    errCountWindow++;
    try {
      const headers = { 'Content-Type': 'application/json' };
      const t = getToken();
      if (t) headers.Authorization = 'Bearer ' + t;
      fetch('/api/system/client-error', {
        method: 'POST', credentials: 'omit', headers,
        body: JSON.stringify({ message: String(message).slice(0, 350), detail: String(detail || '').slice(0, 1500) })
      }).catch(() => { });
    } catch (e) { }
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('error', (ev) => {
      if (ev && ev.message) reportClientError(ev.message, `${ev.filename || ''}:${ev.lineno || ''}:${ev.colno || ''}`);
    });
    window.addEventListener('unhandledrejection', (ev) => {
      const r = ev && ev.reason;
      const msg = (r && (r.message || String(r))) || 'Unhandled rejection';
      reportClientError(msg, r && r.stack ? r.stack : '');
    });
  }

  /* ---------- запуск ---------- */
  async function boot() {
    try {
      const st = await api('/api/auth/status');
      online = true;
      hasUsers = !!st.has_users;
    } catch (e) {
      online = false;
      hasUsers = false;
    }
    if (online) {
      try {
        const me = await api('/api/auth/me');
        user = me.user;
        myGrade = me.grade || null;
        await pullProgress();
      } catch (e) { user = null; myGrade = null; }
    }
    return { user, online, hasUsers };
  }

  function needsAuth() { return online && hasUsers && !user; }

  /* ---------- вход / регистрация ---------- */
  async function login(username, password) {
    const r = await api('/api/auth/login', { method: 'POST', body: { username, password } });
    user = r.user;
    hasUsers = true;
    if (r.token) setToken(r.token);
    serverUpdated = 0; conflictRetries = 0;
    try { const me = await api('/api/auth/me'); myGrade = me.grade || null; } catch (e) { myGrade = null; }
    await pullProgress();
    return user;
  }

  async function register({ code, display_name, username, password }) {
    const r = await api('/api/auth/register', { method: 'POST', body: { code, display_name, username, password } });
    user = r.user;
    myGrade = null;
    hasUsers = true;
    if (r.token) setToken(r.token);
    serverUpdated = 0; conflictRetries = 0;
    await pullProgress();
    return user;
  }

  async function changePassword(current, next) {
    return api('/api/auth/password', { method: 'POST', body: { current, new: next } });
  }

  async function logout() {
    try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) { }
    setToken('');
    user = null;
    myGrade = null;
  }

  /* ---------- синхронизация прогресса ---------- */
  async function pullProgress() {
    if (!user) return;
    try {
      const r = await api('/api/progress');
      serverUpdated = Number(r.updated_at) || 0;
      const server = (r.payload && typeof r.payload === 'object' && !Array.isArray(r.payload))
        ? r.payload : {};
      const local = window.__state ? window.__state() : null;
      const serverHas = Object.keys(server.lessons || {}).length > 0;
      const localHas = !!local && Object.keys(local.lessons || {}).length > 0;

      if (!serverHas && localHas) {
        // Локально есть, на сервере пусто — отправляем локальное.
        persist(true);
      } else if (serverHas && !localHas) {
        window.__setState(Object.assign({}, local || {}, server));
      } else if (serverHas && localHas) {
        // Оба непустые: объединяем, а не перезаписываем — иначе занятия
        // на телефоне и компьютере стирали бы друг друга.
        const before = JSON.stringify(local);
        if (window.__mergeProgress) window.__mergeProgress(server);
        if (window.__state && JSON.stringify(window.__state()) !== before) persist(true);
      }
    } catch (e) { /* останется локально */ }
  }

  function persist(immediate = false) {
    if (!user || !online) return;
    clearTimeout(syncTimer);
    const send = () => {
      const payload = window.__state ? window.__state() : null;
      if (!payload) return;
      pending = payload;
      api('/api/progress', { method: 'PUT', body: { payload, base_updated: serverUpdated } })
        .then((r) => {
          lastSync = Date.now();
          pending = null;
          conflictRetries = 0;
          serverUpdated = Number(r && r.updated_at) || serverUpdated;
        })
        .catch((err) => {
          // 401 уже обработан в api().
          if (err && err.status === 401) return;
          if (err && err.status === 409 && err.data && err.data.payload) {
            // Другое устройство сохранило новее: объединяем и повторяем.
            if (window.__mergeProgress) window.__mergeProgress(err.data.payload);
            serverUpdated = Number(err.data.updated_at) || serverUpdated;
            if (++conflictRetries <= 3) {
              clearTimeout(syncTimer);
              syncTimer = setTimeout(send, 300);
            }
            return;
          }
          // Сеть или сервер: повторяем позже, чтобы прогресс не осел
          // только в браузере.
          clearTimeout(syncTimer);
          syncTimer = setTimeout(send, 5000);
        });
    };
    if (immediate) send(); else syncTimer = setTimeout(send, 1200);
  }

  /* ============================================================
     ЭКРАН ВХОДА
     ============================================================ */
  function renderAuth(root) {
    const wrap = document.createElement('div');
    wrap.className = 'auth-wrap';

    let mode = hasUsers ? 'login' : 'register';

    const card = document.createElement('div');
    card.className = 'panel auth-card';
    wrap.appendChild(card);
    root.appendChild(wrap);

    function paint() {
      card.innerHTML = '';
      const head = document.createElement('div');
      head.className = 'auth-head';
      head.innerHTML = `
        <div class="auth-logo">学</div>
        <h1>汉语学习</h1>
        <p>${hasUsers ? 'Войдите, чтобы прогресс сохранялся и учитель видел ваши результаты'
          : 'Вы первый пользователь — регистрация даст вам роль <b>владельца</b> (учителя)'}</p>`;
      card.appendChild(head);

      if (!online) {
        const isFilePreview = (location.protocol !== 'http:' && location.protocol !== 'https:');
        const warn = document.createElement('div');
        warn.className = 'auth-warn';
        warn.innerHTML = isFilePreview
          ? '⚠️ <b>Открыт просмотр файла без сети.</b> В этом окне нет связи с сервером — вход и панель класса работают только в <b>Live Preview</b> (адрес на порту <code>8080</code>). Вы можете нажать «Продолжить без аккаунта», чтобы заниматься локально.'
          : '⚠️ Сервер недоступен — работает <b>локальный режим</b>. Проверьте, запущен ли сервер, или нажмите «Продолжить без аккаунта».';
        card.appendChild(warn);
      }

      const tabs = document.createElement('div');
      tabs.className = 'tabs';
      if (hasUsers) {
        [['login', '🔑 Вход'], ['register', '📝 Регистрация по коду']].forEach(([id, t]) => {
          const b = document.createElement('button');
          b.className = 'tab' + (mode === id ? ' active' : '');
          b.textContent = t;
          b.onclick = () => { mode = id; paint(); };
          tabs.appendChild(b);
        });
        card.appendChild(tabs);
      }

      const form = document.createElement('form');
      form.className = 'auth-form';
      const err = document.createElement('div');
      err.className = 'auth-error';
      err.style.display = 'none';

      const field = (label, name, type = 'text', placeholder = '') => {
        const wrapf = document.createElement('label');
        wrapf.className = 'field';
        wrapf.innerHTML = `<span>${label}</span>`;
        const inp = document.createElement('input');
        inp.type = type; inp.name = name; inp.placeholder = placeholder; inp.autocomplete = type === 'password' ? 'current-password' : 'off';
        wrapf.appendChild(inp);
        return { wrap: wrapf, inp };
      };

      let fUser, fPass, fCode, fName;

      if (mode === 'login') {
        fUser = field('Логин или имя', 'username', 'text', 'например ali01 или Али');
        fPass = field('Пароль', 'password', 'password', '••••••');
        form.appendChild(fUser.wrap); form.appendChild(fPass.wrap);
      } else {
        fCode = hasUsers
          ? field('Код от учителя', 'code', 'text', 'ABC-123')
          : field('Код от учителя (не нужен — вы первый)', 'code', 'text', 'оставьте пустым');
        fName = field('Ваше имя', 'display_name', 'text', 'Али');
        fUser = field('Логин (необязательно)', 'username', 'text', 'придумайте или оставьте пустым');
        fPass = field('Пароль (минимум 8 символов)', 'password', 'password', '••••••');
        fPass.inp.minLength = 8;
        if (!hasUsers) {
          const tip = document.createElement('div');
          tip.className = 'auth-warn';
          tip.innerHTML = '👑 <b>Вы — первый пользователь.</b> Регистрация даст вам роль владельца: вы увидите весь класс, сможете создавать учеников и выставлять оценки.';
          form.appendChild(tip);
        }
        form.appendChild(fCode.wrap); form.appendChild(fName.wrap);
        form.appendChild(fUser.wrap); form.appendChild(fPass.wrap);
      }
      card.appendChild(err);
      card.appendChild(form);

      const btn = document.createElement('button');
      btn.className = 'btn btn-primary auth-submit';
      btn.textContent = mode === 'login' ? 'Войти →' : 'Создать аккаунт →';
      btn.type = 'submit';
      form.appendChild(btn);

      form.onsubmit = async (e) => {
        e.preventDefault();
        err.style.display = 'none';
        if (!online) {
          // попробуем ещё раз проверить сервер перед отказом
          try {
            const st = await api('/api/auth/status');
            online = true;
            hasUsers = !!st.has_users;
          } catch (_) {
            err.textContent = (location.protocol !== 'http:' && location.protocol !== 'https:')
              ? 'Нет связи с сервером: вы смотрите статический файл. Откройте приложение через Live Preview (порт 8080).'
              : 'Сервер недоступен. Обновите страницу или проверьте подключение.';
            err.style.display = 'block';
            return;
          }
        }
        btn.disabled = true;
        btn.textContent = 'Подождите…';
        try {
          if (mode === 'login') {
            await login(fUser.inp.value.trim(), fPass.inp.value);
          } else {
            if (fPass.inp.value.length < 8) {
              throw new Error('weak_password');
            }
            await register({
              code: fCode.inp.value.trim(),
              display_name: fName.inp.value.trim(),
              username: fUser.inp.value.trim(),
              password: fPass.inp.value
            });
          }
          window.__afterAuth();
        } catch (ex) {
          const map = {
            bad_credentials: 'Неверный логин или пароль',
            bad_invite: 'Код не найден или уже использован',
            name_required: 'Введите имя (минимум 2 символа)',
            weak_password: 'Пароль слишком короткий (минимум 8 символов)',
            bad_password: 'Текущий пароль указан неверно',
            password_too_long: 'Пароль слишком длинный (максимум 256 символов)',
            cannot_touch_owner: 'Владельца аккаунта изменить нельзя',
            too_many: 'Слишком много попыток. Подождите 5 минут.',
            not_authenticated: 'Сессия истекла — войдите заново'
          };
          err.textContent = map[ex.message] || ('Ошибка: ' + ex.message);
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = mode === 'login' ? 'Войти →' : 'Создать аккаунт →';
        }
      };

      const guest = document.createElement('button');
      guest.className = 'btn btn-ghost auth-guest';
      guest.textContent = 'Продолжить без аккаунта (локально)';
      guest.onclick = () => { window.__guestMode(); };
      card.appendChild(guest);
    }
    paint();
  }

  /* ============================================================
     УЧИТЕЛЬСКАЯ ПАНЕЛЬ
     ============================================================ */
  async function renderClass(root) {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<h1 class="page-title">👨‍🏫 Класс</h1><p class="page-sub">Загрузка…</p>';
    root.appendChild(wrap);

    let tab = 'class'; // 'class' | 'system'
    let data, invites = [], sys = null;
    async function loadData() {
      const reqs = [
        api('/api/class/overview'),
        api('/api/class/invites').catch(() => ({ invites: [] }))
      ];
      if (user?.role === 'owner') reqs.push(api('/api/system/status').catch(() => null));
      const [ov, iv, sy] = await Promise.all(reqs);
      data = ov;
      invites = (iv.invites || []).filter(i => !i.used_by);
      if (sy !== undefined) sys = sy;
    }
    try {
      await loadData();
    } catch (e) {
      wrap.innerHTML = '<h1 class="page-title">👨‍🏫 Класс</h1><div class="panel">Нет доступа или сервер недоступен.</div>';
      return;
    }

    async function reload() {
      try { await loadData(); paint(); } catch (e) { paint(); }
    }

    const paint = () => {
      wrap.innerHTML = '';
      wrap.appendChild(el2('h1', 'page-title', `👨‍🏫 Класс — ${ROLE_RU[user?.role] || 'Учитель'}`));
      wrap.appendChild(el2('p', 'page-sub',
        `Учеников: ${data.count} · средний балл класса: ${data.avg_score}% · средняя точность: ${data.avg_accuracy}% · активны сегодня: ${data.active_today}`));

      if (user?.role === 'owner') {
        const tabs = el2('div', 'tabs');
        const errN = sys?.counts?.errors || 0;
        [['class', '📋 Ученики и коды'], ['system', `🛠 Состояние системы${errN ? ` (${errN})` : ''}`]].forEach(([id, label]) => {
          const b = el2('button', 'tab' + (tab === id ? ' active' : ''), label);
          b.onclick = () => { tab = id; paint(); };
          tabs.appendChild(b);
        });
        wrap.appendChild(tabs);
      }

      if (tab === 'system' && user?.role === 'owner') {
        paintSystem();
        return;
      }

      /* --- приглашения --- */
      const inv = el2('div', 'panel');
      inv.appendChild(el2('h3', '', '🔑 Коды для учеников'));
      inv.appendChild(el2('p', 'page-sub', 'Создайте код, отправьте ученику. Он введёт код при регистрации, выберет имя и пароль.'));
      const btnRow = el2('div', 'btn-row');
      const mk = el2('button', 'btn btn-primary', '＋ Создать код');
      const csv = el2('button', 'btn btn-ghost', '⬇ Экспорт CSV');
      csv.onclick = async () => {
        try {
          const headers = {};
          const t = getToken();
          if (t) headers.Authorization = 'Bearer ' + t;
          const res = await fetch('/api/class/export.csv', { credentials: 'omit', headers });
          if (!res.ok) throw new Error(res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'klass.csv';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) { toast('Ошибка экспорта'); }
      };
      btnRow.appendChild(mk); btnRow.appendChild(csv);
      inv.appendChild(btnRow);
      const codeBox = el2('div', 'code-list');
      const addCodeRow = (code, whenText) => {
        const c = el2('div', 'code-item');
        c.innerHTML = `<b>${esc(code)}</b><span>${esc(whenText)}</span>`;
        const copy = el2('button', 'btn btn-sm', '📋 Копировать');
        copy.onclick = () => { navigator.clipboard?.writeText(code); toast('Код скопирован'); };
        const rev = el2('button', 'btn btn-sm', 'Отозвать');
        rev.onclick = async () => { await api('/api/class/invites/revoke', { method: 'POST', body: { code } }); reload(); };
        c.appendChild(copy); c.appendChild(rev);
        codeBox.appendChild(c);
      };
      invites.forEach(i => addCodeRow(i.code, 'активен · ' + timeAgo(i.created_at)));
      inv.appendChild(codeBox);
      mk.onclick = async () => {
        try {
          const r = await api('/api/class/invite', { method: 'POST', body: {} });
          toast('Код создан: ' + r.code);
          await reload();
        } catch (e) { toast('Ошибка'); }
      };
      wrap.appendChild(inv);

      /* --- таблица учеников --- */
      const t = el2('div', 'panel');
      t.appendChild(el2('h3', '', `📋 Ученики (${data.count})`));
      if (!data.students.length) {
        t.appendChild(el2('div', 'empty', 'Пока нет учеников. Создайте код выше и отправьте его ученикам.'));
      } else {
        const table = el2('div', 'student-table');
        table.appendChild(el2('div', 'st-row st-head', `
          <span>Ученик</span><span>Уроки</span><span>Балл</span><span>Точность</span>
          <span>Карточки</span><span>Дней</span><span>Активность</span><span>Оценка</span><span></span>`));
        data.students.forEach(s => {
          const row = el2('div', 'st-row');
          row.innerHTML = `
            <span class="st-name"><b>${esc(s.display_name)}</b><i>@${esc(s.username)}</i></span>
            <span>${s.lessons_done}/${s.lessons_total}</span>
            <span class="${s.avg_score >= 80 ? 'ok' : s.avg_score >= 50 ? 'mid' : 'bad'}">${s.avg_score}%</span>
            <span>${s.accuracy}%</span>
            <span>${s.cards}</span>
            <span>${s.streak}</span>
            <span class="st-when">${s.active_today ? 'сегодня' : timeAgo(s.last_active)}</span>
            <span class="st-grade">${s.grade ? esc(s.grade) : '—'}</span>
            <span class="st-acts"></span>`;
          const acts = row.querySelector('.st-acts');
          const view = el2('button', 'btn btn-sm', '👁');
          view.onclick = () => openStudent(s.id, reload);
          const grade = el2('button', 'btn btn-sm', '✍️');
          grade.onclick = () => openStudent(s.id, reload, true);
          acts.appendChild(view); acts.appendChild(grade);
          table.appendChild(row);
        });
        t.appendChild(table);
      }
      wrap.appendChild(t);
    };

    function fmtDur(sec) {
      sec = Math.max(0, Number(sec || 0));
      if (sec < 60) return sec + ' сек';
      if (sec < 3600) return Math.floor(sec / 60) + ' мин';
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      return h + ' ч ' + m + ' мин';
    }
    function fmtBytes(b) {
      b = Number(b || 0);
      if (b < 1024) return b + ' Б';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' КБ';
      return (b / (1024 * 1024)).toFixed(2) + ' МБ';
    }

    function paintSystem() {
      const sp = el2('div', 'panel');
      sp.appendChild(el2('h3', '', '🖥 Состояние сервера и базы данных'));
      if (!sys) {
        sp.appendChild(el2('div', 'empty', 'Не удалось получить статус сервера.'));
        wrap.appendChild(sp);
        return;
      }
      const c = sys.counts || {};
      const grid = el2('div', 'stat-grid');
      grid.innerHTML = `
        <div><b class="ok">Работает ✓</b><span>сервер (Python ${esc(sys.python_version)})</span></div>
        <div><b>${fmtDur(sys.uptime_sec)}</b><span>время работы</span></div>
        <div><b>${fmtBytes(sys.db_size_bytes)}</b><span>размер базы app.db</span></div>
        <div><b>${c.users || 0}</b><span>пользователей (${c.students || 0} уч.)</span></div>
        <div><b>${c.sessions_active || 0}</b><span>активных сессий</span></div>
        <div><b class="${(c.errors || 0) ? 'bad' : 'ok'}">${c.errors || 0}</b><span>ошибок в журнале</span></div>`;
      sp.appendChild(grid);

      const act = el2('div', 'btn-row');
      const bk = el2('button', 'btn btn-primary', '💾 Скачать резервную копию (app.db)');
      bk.onclick = async () => {
        try {
          const headers = {};
          const t = getToken();
          if (t) headers.Authorization = 'Bearer ' + t;
          const res = await fetch('/api/system/backup', { credentials: 'omit', headers });
          if (!res.ok) throw new Error(res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'chinese-app-backup.db';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast('Резервная копия скачана');
        } catch (e) { toast('Ошибка скачивания копии'); }
      };
      const rf = el2('button', 'btn btn-ghost', '🔄 Обновить');
      rf.onclick = () => reload();
      const cp = el2('button', 'btn btn-ghost', '📋 Скопировать отчёт');
      cp.onclick = () => {
        const lines = [
          `汉语学习 — Отчёт системы (${new Date().toLocaleString('ru-RU')})`,
          `Python: ${sys.python_version} | Uptime: ${fmtDur(sys.uptime_sec)} | DB: ${fmtBytes(sys.db_size_bytes)}`,
          `Users: ${c.users} (students: ${c.students}) | Sessions: ${c.sessions_active} | Errors: ${c.errors}`,
          ...(sys.errors || []).slice(0, 20).map(e =>
            `[${new Date(e.created_at * 1000).toISOString()}] (${e.source}${e.username ? ' @' + e.username : ''}) ${e.message}${e.detail ? '\n  ' + e.detail.replace(/\n/g, ' | ') : ''}`)
        ].join('\n');
        navigator.clipboard?.writeText(lines);
        toast('Отчёт скопирован — можно вставить в чат');
      };
      const cl = el2('button', 'btn btn-ghost', '🧹 Очистить журнал');
      cl.onclick = async () => {
        await api('/api/system/errors/clear', { method: 'POST', body: {} });
        toast('Журнал очищен');
        reload();
      };
      act.appendChild(bk); act.appendChild(rf); act.appendChild(cp); act.appendChild(cl);
      sp.appendChild(act);
      wrap.appendChild(sp);

      const ep = el2('div', 'panel');
      ep.appendChild(el2('h3', '', `🪵 Журнал ошибок (${(sys.errors || []).length})`));
      if (!(sys.errors || []).length) {
        ep.appendChild(el2('div', 'empty', 'Ошибок нет ✓'));
      } else {
        const list = el2('div', 'sys-errors');
        (sys.errors || []).forEach(e => {
          const item = el2('div', 'sys-err');
          item.innerHTML = `
            <div class="se-head">
              <span class="se-badge ${e.source === 'server' ? 'se-srv' : 'se-cli'}">${e.source === 'server' ? 'Сервер' : 'Браузер'}</span>
              <b>${esc(e.message)}</b>
              <i>${e.username ? '@' + esc(e.username) + ' · ' : ''}${timeAgo(e.created_at)}</i>
            </div>
            ${e.detail ? `<pre class="se-det">${esc(e.detail)}</pre>` : ''}`;
          list.appendChild(item);
        });
        ep.appendChild(list);
      }
      wrap.appendChild(ep);
    }

    /* --- карточка ученика --- */
    /* Временный пароль: без похожих символов (0/O, 1/l/I), чтобы его
       можно было продиктовать ученику без ошибок. */
    function genTempPassword(len = 10) {
      const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
      let out = '';
      const buf = new Uint32Array(len);
      if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(buf);
      else for (let i = 0; i < len; i++) buf[i] = Math.floor(Math.random() * 1e9);
      for (let i = 0; i < len; i++) out += abc[buf[i] % abc.length];
      return out;
    }

    async function openStudent(id, refresh, focusGrade = false) {
      let d;
      try { d = await api('/api/class/students/' + id); } catch (e) { toast('Не удалось загрузить'); return; }
      const ov = document.createElement('div');
      ov.className = 'overlay';
      const modal = document.createElement('div');
      modal.className = 'panel modal';
      const s = d.summary;
      modal.innerHTML = `
        <div class="modal-head"><h2>${esc(d.user.display_name)} <span class="lvl-chip">${ROLE_RU[d.user.role]}</span></h2>
        <button class="modal-x">✕</button></div>
        <div class="stat-grid">
          <div><b>${s.lessons_done}/${s.lessons_total}</b><span>уроков</span></div>
          <div><b>${s.avg_score}%</b><span>средний балл</span></div>
          <div><b>${s.accuracy}%</b><span>точность</span></div>
          <div><b>${s.cards}</b><span>карточек</span></div>
          <div><b>${s.streak}</b><span>дней подряд</span></div>
          <div><b>${s.answers}</b><span>ответов</span></div>
        </div>
        <h3>Баллы по урокам</h3>
        <div class="lesson-bars">${Object.entries(s.lesson_scores || {}).map(([k, v]) => {
          const L = window.__lessonTitle ? window.__lessonTitle(k) : k;
          return `<div class="lb"><span>${esc(L)}</span><div class="lb-bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`;
        }).join('') || '<span class="empty">Нет данных</span>'}</div>
        <h3>Оценка и комментарий</h3>
        <div class="grade-edit">
          <input class="g-input" placeholder="Оценка (напр. 85 или 5)" value="${esc(d.grade?.grade || '')}">
          <input class="g-input wide" placeholder="Комментарий учителя" value="${esc(d.grade?.comment || '')}">
          <button class="btn btn-primary g-save">Сохранить</button>
        </div>
        <h3>Активность</h3>
        <div class="events">${(d.events || []).slice(0, 12).map(e =>
          `<div class="ev"><span>${esc(e.kind)}</span><span>${esc(e.detail || '')}</span><i>${timeAgo(e.created_at)}</i></div>`).join('') || '<span class="empty">Пока пусто</span>'}</div>
        <div class="modal-foot">
          <button class="btn btn-ghost m-pass">🔑 Сбросить пароль</button>
          <button class="btn btn-ghost m-reset">Сбросить прогресс</button>
          <button class="btn btn-danger m-del">Удалить ученика</button>
          ${user?.role === 'owner' ? '<button class="btn btn-ghost m-role">Сделать учителем</button>' : ''}
        </div>`;
      ov.appendChild(modal);
      root.appendChild(ov);
      const close = () => ov.remove();
      modal.querySelector('.modal-x').onclick = close;
      ov.onclick = e => { if (e.target === ov) close(); };

      modal.querySelector('.g-save').onclick = async () => {
        const g = modal.querySelector('.g-input').value.trim();
        const c = modal.querySelector('.g-input.wide').value.trim();
        await api('/api/class/grade', { method: 'POST', body: { student_id: id, grade: g, comment: c } });
        toast('Оценка сохранена');
        close(); refresh();
      };
      modal.querySelector('.m-pass').onclick = async () => {
        const temp = genTempPassword();
        if (!confirm(`Сбросить пароль ученика?\n\nНовый пароль: ${temp}\n\nПередайте его ученику — старый пароль и все его сессии перестанут работать.`)) return;
        try {
          await api('/api/class/password', { method: 'POST', body: { student_id: id, new_password: temp } });
          toast('Пароль сброшен: ' + temp);
        } catch (e) { toast('Не удалось сбросить пароль'); }
      };
      modal.querySelector('.m-reset').onclick = async () => {
        if (!confirm('Сбросить весь прогресс ученика?')) return;
        await api('/api/class/reset', { method: 'POST', body: { student_id: id } });
        toast('Прогресс сброшен'); close(); refresh();
      };
      modal.querySelector('.m-del').onclick = async () => {
        if (!confirm('Удалить ученика без возможности восстановления?')) return;
        await api('/api/class/delete', { method: 'POST', body: { student_id: id } });
        toast('Ученик удалён'); close(); refresh();
      };
      const roleBtn = modal.querySelector('.m-role');
      if (roleBtn) roleBtn.onclick = async () => {
        await api('/api/class/role', { method: 'POST', body: { user_id: id, role: 'teacher' } });
        toast('Статус изменён'); close(); refresh();
      };
      if (focusGrade) setTimeout(() => modal.querySelector('.g-input').focus(), 60);
    }

    paint();
  }

  function timeAgo(ts) {
    if (!ts) return '—';
    const s = Math.floor((Date.now() - ts * 1000) / 1000);
    if (s < 60) return 'только что';
    if (s < 3600) return Math.floor(s / 60) + ' мин назад';
    if (s < 86400) return Math.floor(s / 3600) + ' ч назад';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' дн назад';
    return new Date(ts * 1000).toLocaleDateString('ru-RU');
  }

  function el2(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toast(msg) { if (window.toast) window.toast(msg); }

  return {
    boot, needsAuth, renderAuth, renderClass, persist,
    login, logout, register, changePassword,
    get user() { return user; },
    get grade() { return myGrade; },
    get online() { return online; },
    get hasUsers() { return hasUsers; },
    ROLE_RU
  };
})();
// const не создаёт свойство window — выставляем явно
window.Auth = Auth;

</script>
<script>
/* ============================================================
   汉语学习 · Приложение «Китайский язык»
   Логика: роутер, уроки, SRS-карточки, тоны, пропись, чтение
   ============================================================ */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Хранилище ----------
   В iframe с непрозрачным origin (sandbox="allow-scripts") браузер запрещает
   доступ к localStorage. Поэтому используем безопасную обёртку с запасным
   хранилищем в памяти — приложение работает в любом контексте. */
const Store = (() => {
  const mem = {};
  let usable = true;
  try {
    localStorage.setItem('__zh_probe__', '1');
    localStorage.removeItem('__zh_probe__');
  } catch (e) { usable = false; }
  return {
    persistent: usable,
    get(k) {
      try { return usable ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }
      catch (e) { return k in mem ? mem[k] : null; }
    },
    set(k, v) {
      try { if (usable) localStorage.setItem(k, v); else mem[k] = v; }
      catch (e) { mem[k] = v; }
    },
    remove(k) {
      try { if (usable) localStorage.removeItem(k); } catch (e) { }
      delete mem[k];
    }
  };
})();
window.Store = Store;

const KEY = 'zh_progress_v1';
const DEFAULT_STATE = { lessons: {}, cards: {}, custom: [], days: [], streak: 0, lastDay: '', quizLog: [], totalRight: 0, totalWrong: 0 };
let state = load();

function load() {
  try {
    const raw = Store.get(KEY);
    if (!raw) return { ...DEFAULT_STATE };
    return { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch (e) { return { ...DEFAULT_STATE }; }
}
function save() {
  Store.set(KEY, JSON.stringify(state));
  if (window.Auth) Auth.persist();
}
window.__state = () => state;
window.__setState = (s) => { state = { ...DEFAULT_STATE, ...s }; Store.set(KEY, JSON.stringify(state)); };

/* Слияние серверного прогресса с локальным.
   Нужно, когда ученик занимается и на телефоне, и на компьютере:
   берём лучшее из двух состояний, а не «кто последний сохранил». */
function mergeProgress(incoming) {
  if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) return state;
  const server = incoming;

  const lessons = Object.assign({}, server.lessons || {});
  Object.keys(state.lessons || {}).forEach(id => {
    const lv = state.lessons[id] || {};
    const sv = lessons[id];
    if (!sv) { lessons[id] = lv; return; }
    lessons[id] = Object.assign({}, sv, lv, {
      score: Math.max(Number(lv.score) || 0, Number(sv.score) || 0),
      done: !!(lv.done || sv.done),
      at: Math.max(Number(lv.at) || 0, Number(sv.at) || 0)
    });
  });

  // Карточки: локальные «свежее» по коробке, серверные дополняют список.
  const cards = Object.assign({}, server.cards || {}, state.cards || {});
  const days = Array.from(new Set(
    [].concat(server.days || [], state.days || []).filter(d => typeof d === 'string')
  )).sort().slice(-400);
  const quizLog = [].concat(server.quizLog || [], state.quizLog || [])
    .filter(q => q && typeof q === 'object').slice(-500);

  state = Object.assign({}, DEFAULT_STATE, server, state, {
    lessons, cards, days, quizLog,
    totalRight: Math.max(Number(state.totalRight) || 0, Number(server.totalRight) || 0),
    totalWrong: Math.max(Number(state.totalWrong) || 0, Number(server.totalWrong) || 0),
    streak: Math.max(Number(state.streak) || 0, Number(server.streak) || 0),
    lastDay: (String(state.lastDay || '') > String(server.lastDay || ''))
      ? state.lastDay : server.lastDay
  });
  Store.set(KEY, JSON.stringify(state));
  return state;
}
window.__mergeProgress = mergeProgress;
window.__lessonTitle = (id) => (LESSONS[id] && LESSONS[id].title) || id;

function today() { return new Date().toISOString().slice(0, 10); }
function touchDay() {
  const t = today();
  if (state.lastDay !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    state.streak = state.lastDay === y ? state.streak + 1 : 1;
    state.lastDay = t;
    if (!state.days.includes(t)) state.days.push(t);
    state.days = state.days.slice(-400);
    save();
  }
}

/* ---------- Настройки (скорость речи, тема, звуки) ---------- */
const PREFS = {
  get slow() { return Store.get('zh_rate') === 'slow'; },
  set slow(v) { Store.set('zh_rate', v ? 'slow' : 'normal'); },
  get theme() { return Store.get('zh_theme') === 'light' ? 'light' : 'dark'; },
  set theme(v) {
    Store.set('zh_theme', v === 'light' ? 'light' : 'dark');
    if (typeof document !== 'undefined') document.documentElement.dataset.theme = v === 'light' ? 'light' : '';
  },
  get sfx() { return Store.get('zh_sfx') !== 'off'; },
  set sfx(v) { Store.set('zh_sfx', v ? 'on' : 'off'); }
};
if (typeof document !== 'undefined' && PREFS.theme === 'light') {
  document.documentElement.dataset.theme = 'light';
}

/* ---------- Речь (TTS) ---------- */
let voicesReady = false;
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  voicesReady = true;
}
if ('speechSynthesis' in window) {
  initVoices();
  speechSynthesis.onvoiceschanged = initVoices;
}
function speak(text, rate) {
  if (!('speechSynthesis' in window)) { toast('Браузер не поддерживает озвучку'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = rate !== undefined ? rate : (PREFS.slow ? 0.62 : 0.88);
    const v = speechSynthesis.getVoices().find(x => /zh|cmn|Chinese/i.test(x.lang + x.name));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { toast('Ошибка озвучки'); }
}
function toneBtn(text, cls = 'speak') {
  return `<button class="${cls}" data-speak="${esc(text)}" title="Прослушать">🔊</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-speak]');
  if (b) { e.preventDefault(); e.stopPropagation(); speak(b.dataset.speak); }
});

/* ---------- Звуковые эффекты и конфетти ---------- */
function playSfx(kind) {
  if (!PREFS.sfx) return;
  try {
    const ctx = getCtx();
    const t0 = ctx.currentTime;
    const tone = (freq, start, dur, type = 'sine', gain = 0.08) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(0.001, start);
      g.gain.exponentialRampToValueAtTime(gain, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(start); o.stop(start + dur);
    };
    if (kind === 'ok') {
      tone(523.25, t0, 0.14);
      tone(659.25, t0 + 0.07, 0.22);
    } else if (kind === 'bad') {
      tone(220, t0, 0.16, 'triangle', 0.07);
      tone(175, t0 + 0.08, 0.2, 'triangle', 0.06);
    } else if (kind === 'win') {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t0 + i * 0.08, 0.3, 'sine', 0.09));
    }
  } catch (e) { }
}
function launchConfetti() {
  try {
    const box = document.createElement('div');
    box.className = 'confetti-box';
    const colors = ['#e0b354', '#d0453a', '#5aa88f', '#6a9fd4', '#ffd9d3'];
    for (let i = 0; i < 34; i++) {
      const p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.45) + 's';
      p.style.animationDuration = (1.6 + Math.random() * 0.9) + 's';
      p.style.setProperty('--dx', ((Math.random() - 0.5) * 160) + 'px');
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2800);
  } catch (e) { }
}

/* ---------- Уведомления ---------- */
let toastEl;
function toast(msg) {
  if (!toastEl) { toastEl = el('div', 'toast'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ============================================================
   РОУТЕР
   ============================================================ */
const ROUTES = {
  home: renderHome,
  plan: renderPlan,
  lesson: renderLesson,
  diag: renderDiagnostic,
  cards: renderCards,
  tones: renderTones,
  write: renderWrite,
  read: renderRead,
  phrases: renderPhrases,
  videos: renderVideos,
  tutor: renderTutor,
  stats: renderStats,
  dict: renderDict,
  class: (root) => Auth.renderClass(root),
  account: renderAccount
};
function route() {
  if (typeof videoStop === 'function') videoStop();
  clearQuizKeys();
  const view = $('#view');
  view.innerHTML = '';
  if (window.Auth && Auth.needsAuth() && !window.__guest) { renderAuthGate(); return; }
  const hash = location.hash.replace(/^#\/?/, '') || 'home';
  const [name, ...rest] = hash.split('/');
  const fn = ROUTES[name] || renderHome;
  view.scrollTop = 0;
  fn(view, rest);
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === (name || 'home')));
  $$('#mnav a').forEach(a => a.classList.toggle('active', a.dataset.route === (name || 'home')));
  const fab = $('#tutorFab');
  if (fab) fab.style.display = name === 'tutor' ? 'none' : 'flex';
  window.scrollTo(0, 0);
}
function renderAuthGate() {
  const view = $('#view');
  view.innerHTML = '';
  Auth.renderAuth(view);
}
window.__showAuth = () => { window.__guest = false; renderAuthGate(); };
window.__afterAuth = () => { window.__guest = false; paintAccountFoot(); updateNavRoles(); route(); };
window.__guestMode = () => { window.__guest = true; route(); };
window.addEventListener('hashchange', route);

/* ============================================================
   ДАШБОРД
   ============================================================ */
function allLessonIds() { return Object.keys(LESSONS); }
function doneCount() { return Object.values(state.lessons).filter(l => l.done).length; }
function accuracy() {
  const t = state.totalRight + state.totalWrong;
  return t ? Math.round(state.totalRight / t * 100) : 0;
}
function nextLesson() {
  for (const m of MODULES) for (const id of m.lessons) if (!state.lessons[id]?.done) return id;
  return allLessonIds()[0];
}

  const now = Date.now();

          <a class="btn btn-primary" href="${next ? `#/lesson/${next}` : '#/plan'}">Следующий урок →</a>`;
}

function quizSource() { return quizState.lesson === 'diag' ? DIAGNOSTIC : LESSONS[quizState.lesson]; }

/* Горячие клавиши в практике: 1–4 — выбор ответа, Enter — следующий вопрос.
   Без этого на компьютере приходилось каждый раз тянуться к мыши. */
function setQuizKeys(handler) {
  clearQuizKeys();
  if (!quizState) return;
  quizState._keys = handler;
  document.addEventListener('keydown', handler);
}
function clearQuizKeys() {
  if (quizState && quizState._keys) {
    document.removeEventListener('keydown', quizState._keys);
    quizState._keys = null;
  }
}
function renderQuestion(host) {
  const l = quizSource();
  const q = l.quiz[quizState.idx];
  clearQuizKeys();
  host.innerHTML = '';
  if (!q) { finishQuiz(host); return; }

  const head = el('div', 'q-head', `
    <span>Вопрос ${quizState.idx + 1} из ${l.quiz.length}</span>
    <div class="q-bar"><div style="width:${quizState.idx / l.quiz.length * 100}%"></div></div>`);
  host.appendChild(head);

  const body = el('div', 'q-body');
  body.appendChild(el('div', 'q-text', esc(q.q)));
  const fb = el('div', 'q-feedback');
  const controls = el('div', 'q-controls');

  const check = (ok, expl) => {
    if (body.dataset.answered) return;
    body.dataset.answered = '1';
    state.totalRight += ok ? 1 : 0;
    state.totalWrong += ok ? 0 : 1;
    if (ok) quizState.correct++;
    quizState.answers.push({ q: q.q, ok });
    playSfx(ok ? 'ok' : 'bad');
    fb.className = 'q-feedback ' + (ok ? 'ok' : 'bad');
    fb.setAttribute('role', 'status');
    fb.setAttribute('aria-live', 'polite');
    fb.innerHTML = (ok ? '✅ Верно! ' : '❌ Не совсем. ') + (expl || '');
    fb.style.display = 'block';
    const next = el('button', 'btn btn-primary', quizState.idx + 1 >= l.quiz.length ? 'Итоги →' : 'Далее →');
    next.onclick = () => { quizState.idx++; renderQuestion(host); };
    controls.innerHTML = '';
    controls.appendChild(next);
    save();
  };

  if (q.k === 'mcq' || q.k === 'listen') {
    const opts = el('div', 'opts');
    q.o.forEach((o, i) => {
      const b = el('button', 'opt', `<span class="opt-k">${'ABCD'[i]}</span><span>${esc(o)}</span>`);
      b.onclick = () => {
        const ok = i === q.a;
        $$('.opt', opts).forEach((x, xi) => {
          x.disabled = true;
          if (xi === q.a) x.classList.add('right');
          if (xi === i && !ok) x.classList.add('wrong');
        });
        check(ok, ok ? '' : `Правильный ответ: <b>${esc(q.o[q.a])}</b>`);
      };
      opts.appendChild(b);
    });
    body.appendChild(opts);
    body.appendChild(el('div', 'q-hint', 'Клавиши 1–4 — ответ, Enter — далее'));
    setQuizKeys(e => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')) return;
      if (body.dataset.answered) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const nb = controls.querySelector('button');
          if (nb) nb.click();
        }
        return;
      }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.o.length) {
        e.preventDefault();
        const btns = $$('.opt', opts);
        if (btns[n - 1]) btns[n - 1].click();
      }
    });
    if (q.k === 'listen') {
      const pb = el('div', 'listen-row', `${toneBtn(q.o[q.a], 'speak big')} <span>нажмите, чтобы услышать</span>`);
      body.appendChild(pb);
    }
  } else if (q.k === 'gap') {
    const inp = el('input', 'gap-input');
    inp.placeholder = 'введите ответ по-китайски';
    inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
    const sub = el('button', 'btn btn-primary', 'Проверить');
    const norm = s => String(s).trim().replace(/[。．.，,？?！!、\s]/g, '').toLowerCase();
    function submit() {
      const val = norm(inp.value);
      if (!val) return;
      const ok = q.a.some(a => norm(a) === val);
      inp.disabled = true; sub.disabled = true;
      inp.classList.add(ok ? 'right' : 'wrong');
      check(ok, ok ? '' : `Правильно: <b>${esc(q.a[0])}</b>${q.h ? ' — ' + esc(q.h) : ''}`);
    }
    sub.onclick = submit;
    const row = el('div', 'gap-row');
    row.appendChild(inp); row.appendChild(sub);
    body.appendChild(row);
  } else if (q.k === 'order') {
    const picked = [];
    const pool = el('div', 'order-pool');
    const line = el('div', 'order-line');
    q.o.forEach((w, i) => {
      const b = el('button', 'ow', esc(w));
      b.dataset.i = i;
      b.onclick = () => {
        if (b.classList.contains('used')) return;
        b.classList.add('used');
        picked.push({ w, i });
        line.appendChild(el('button', 'ow used-inline', esc(w)));
      };
      pool.appendChild(b);
    });
    const back = el('button', 'btn btn-sm', '↺ Сбросить');
    back.onclick = () => {
      picked.length = 0; line.innerHTML = '';
      $$('.ow', pool).forEach(x => x.classList.remove('used'));
    };
    const sub = el('button', 'btn btn-primary', 'Проверить');
    sub.onclick = () => {
      const seq = picked.map(x => x.i);
      const ok = JSON.stringify(seq) === JSON.stringify(q.a);
      sub.disabled = true; back.disabled = true;
      check(ok, ok ? '' : `Правильно: <b>${esc(q.a.map(i => q.o[i]).join(''))}</b>`);
    };
    body.appendChild(line);
    body.appendChild(pool);
    const ctr = el('div', 'q-controls-inline');
    ctr.appendChild(back); ctr.appendChild(sub);
    body.appendChild(ctr);
  }

  body.appendChild(fb);
  body.appendChild(controls);
  host.appendChild(body);
}

function finishQuiz(host) {
  clearQuizKeys();
  const l = quizSource();
  const score = quizState.correct / l.quiz.length;
  if (quizState.lesson === 'diag') { renderDiagResult(host, score); return; }
  const prev = state.lessons[quizState.lesson] || {};
  state.lessons[quizState.lesson] = {
    done: true,
    score: Math.max(prev.score || 0, score),
    last: score,
    at: Date.now()
  };
  state.quizLog.push({ lesson: quizState.lesson, score, at: Date.now() });
  // Без ограничения лог рос бы годами и раздувал и браузер, и запросы.
  state.quizLog = state.quizLog.slice(-500);
  save();
  if (score >= 0.6) { playSfx('win'); launchConfetti(); }
  host.innerHTML = `<div class="quiz-done">
      <div class="qd-emoji">${score >= 0.8 ? '🎉' : score >= 0.5 ? '👍' : '💪'}</div>
      <h3>Результат: ${quizState.correct} из ${l.quiz.length} (${Math.round(score * 100)}%)</h3>
      <p>${score >= 0.8 ? 'Отличная работа! Этот урок засчитан.'
        : score >= 0.5 ? 'Хорошо, но есть что подтянуть. Посмотрите ошибки выше и повторите урок.'
        : 'Пройдите урок ещё раз после повторения грамматики — и держите темп!'}</p>
      <div class="qd-actions">
        <a class="btn btn-ghost" href="#/lesson/${quizState.lesson}">↻ Повторить</a>
        <a class="btn btn-primary" href="#/plan">К плану →</a>
      </div>
    </div>`;
}

function levelFor(score) { return LEVELS.find(l => score >= l.min) || LEVELS[LEVELS.length - 1]; }

function renderDiagnostic(root) {
  const wrap = el('div');
  wrap.appendChild(el('h1', 'page-title', 'Диагностика уровня'));
  wrap.appendChild(el('p', 'page-sub', '50 вопросов на пиньинь, словарь, грамматику, иероглифы и перевод. Где не знаете — выберите любой ответ или оставьте поле пустым: это честнее и полезнее для разбора.'));
  const host = el('div', 'quiz-host');
  wrap.appendChild(host);
  root.appendChild(wrap);

  host.innerHTML = `<div class="panel quiz-intro">
    <h3>Как это работает</h3>
    <ul class="diag-list">
      <li>Тест занимает 10–15 минут</li>
      <li>Вопросы идут от простого к сложному</li>
      <li>В конце вы получите уровень и рекомендацию, с какого урока начать</li>
    </ul>
    <button class="btn btn-primary" id="startDiag">▶ Начать тест</button>
  </div>`;
  $('#startDiag').onclick = () => {
    quizState = { lesson: 'diag', idx: 0, correct: 0, answers: [], done: false };
    renderQuestion(host);

}

function renderDiagResult(host, score) {
  const lvl = levelFor(Math.round(score * DIAGNOSTIC.quiz.length));
  const total = DIAGNOSTIC.quiz.length;
  const right = Math.round(score * total);
  state.lastDiag = { score, at: Date.now(), level: lvl.name };
  save();
  const weak = quizState.answers.filter(a => !a.ok).slice(0, 8).map(a => a.q);
  host.innerHTML = `<div class="panel quiz-done">
      <div class="qd-emoji">${score >= 0.8 ? '🎉' : score >= 0.5 ? '👍' : '💪'}</div>
      <div class="level-badge">${esc(lvl.name)}</div>
      <h3>${esc(lvl.title)}</h3>
      <p>Правильно ${right} из ${total} (${Math.round(score * 100)}%)</p>
      <div class="diag-result">${esc(lvl.text)}</div>
      ${weak.length ? `<div class="diag-weak"><b>Стоит подтянуть:</b>${weak.map(q => `<span class="weak-chip">${esc(q)}</span>`).join('')}</div>` : '<div class="diag-weak">Ошибок нет — отличный результат!</div>'}
      <div class="qd-actions">
        <a class="btn btn-primary" href="#/lesson/${lvl.lesson}">Начать с урока →</a>
        <a class="btn btn-ghost" href="#/plan">Все уроки</a>
        <button class="btn btn-ghost" id="redoDiag">↻ Пройти заново</button>
      </div>
    </div>`;
  $('#redoDiag').onclick = () => {
    quizState = { lesson: 'diag', idx: 0, correct: 0, answers: [], done: false };
    renderQuestion(host);
  };
}

   ============================================================ */
const BOX_DAYS = [0, 1, 2, 4, 8, 16];
function cardKey(w) { return w.h; }
function addCard(h, p, r, deferSave = false) {
  if (!state.cards[cardKey({ h })]) state.cards[cardKey({ h })] = { box: 0, due: Date.now(), right: 0, wrong: 0, p, r };
  else { const c = state.cards[cardKey({ h })]; if (p) c.p = p; if (r) c.r = r; }
  if (!deferSave) save();
}
function cardPool() {

}

function shuffle(a) { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }

function lookupCardInfo(h) {
  for (const l of Object.values(LESSONS)) {
    const w = l.vocab.find(x => x.h === h);
    if (w) return w;

  if (typeof PHRASES !== 'undefined') {
    for (const cat of PHRASES) {
      const w = (cat.items || []).find(x => x.h === h);
      if (w) return w;
    }
  }
  return null;
}

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
/* Контуры тонов: 1 плоский, 2 восходящий, 3 падающе-восходящий, 4 падающий */
function playTone(n, dur = 1.0) {
  try {
    const ctx = getCtx();
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    const pts = {
      1: [[0, 260], [dur, 260]],
      2: [[0, 240], [dur * 0.85, 380]],
      3: [[0, 270], [dur * 0.42, 185], [dur * 0.85, 260]],
      4: [[0, 380], [dur * 0.9, 175]]
    }[n];
    osc.frequency.setValueAtTime(pts[0][1], t0);
    for (let i = 1; i < pts.length; i++) osc.frequency.linearRampToValueAtTime(pts[i][1], t0 + pts[i][0]);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.04);
    g.gain.setValueAtTime(0.25, t0 + dur - 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  } catch (e) { toast('Аудио недоступно'); }
}

function renderWriteCard(host) {

  let demoTimer = null;

    if (!ctx) return;

      step++;

      ctx.rect(0, 0, size, (size * step) / total);

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  }

  let drawing = false;
  const pos = e => {
    const r = canvas.getBoundingClientRect();

  const move = e => { if (!drawing || !ctx) return; e.preventDefault(); const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); };
  const end = () => { drawing = false; };

  /* Pointer-события покрывают мышь, палец и стилус одним путём.
     mousedown/touchstart оставлены как запасной вариант для старых браузеров. */
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); start(e); });
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  } else {
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  /* Доступность: поле письма было недостижимо с клавиатуры и не описано
     для скринридера. Клавиатурный пользователь может пропустить знак. */
  canvas.tabIndex = 0;
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label',
    `Пропись иероглифа ${item.h}. Нарисуйте знак мышью, пальцем или стилусом.`);
  canvas.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const idx = (writeState.idx + 1) % HANDWRITING.length;
      writeState.idx = idx;
      renderWriteCard(host);
    }
  });

  box.appendChild(canvas);
  p.appendChild(box);

  const ctr = el('div', 'write-ctr');
  const prev = el('button', 'btn btn-ghost', '←');
  prev.onclick = () => { clearInterval(demoTimer); writeState.idx = (writeState.idx - 1 + HANDWRITING.length) % HANDWRITING.length; renderWriteCard(host); };
  const next = el('button', 'btn btn-primary', 'Следующий →');
  next.onclick = () => { clearInterval(demoTimer); writeState.idx = (writeState.idx + 1) % HANDWRITING.length; renderWriteCard(host); };
  const demo = el('button', 'btn btn-ghost', '▶ Образец');
  demo.onclick = () => playDemo();
  const clr = el('button', 'btn btn-ghost', '🧽 Очистить');
  clr.onclick = () => { clearInterval(demoTimer); grid(); };
  const spk = el('button', 'btn btn-ghost', '🔊');
  spk.onclick = () => speak(item.h);
  ctr.appendChild(prev); ctr.appendChild(demo); ctr.appendChild(clr); ctr.appendChild(spk); ctr.appendChild(next);
  p.appendChild(ctr);
  host.appendChild(p);

  const idx = el('div', 'write-strip');
  HANDWRITING.forEach((h, i) => {
    const b = el('button', 'ws-item' + (i === writeState.idx ? ' active' : ''), esc(h.h));
    b.onclick = () => { writeState.idx = i; renderWriteCard(host); };
    idx.appendChild(b);
  });
  host.appendChild(idx);
}

/* Разбор строки на символы: каждому иероглифу — свой слог пиньинь */
function buildLine(hanzi, pinyin) {
  const syls = String(pinyin).replace(/[，。？！、；：,.?!;:"'()（）]/g, ' ').trim().split(/\s+/).filter(Boolean);
  let i = 0;
  return [...hanzi].map(ch => {
    if (/[\u4e00-\u9fa5]/.test(ch)) return { ch, py: syls[i++] || '' };
    return { ch, punct: true };
  });
}

function renderVideos(root) {

        4: 'M 10 12 Q 60 28 110 50'

        if (vidState.playing) { videoStop(); paintPlayer(); return; }

        playStep();

      const prevB = el('button', 'btn btn-ghost', '⏮');
      prevB.onclick = () => { videoStop(); vidState.sceneIdx = Math.max(0, vidState.sceneIdx - 1); paintPlayer(); if (sc.speak) speak(L.scenes[vidState.sceneIdx].speak); };

      nextB.onclick = () => { videoStop(); vidState.sceneIdx = (vidState.sceneIdx + 1) % L.scenes.length; paintPlayer(); speak(L.scenes[vidState.sceneIdx].speak); };

      const subB = el('button', 'btn btn-ghost', vidState.subs ? '💬 Субтитры: вкл' : '💬 Субтитры: выкл');

   ВНУТРЕННИЙ ИИ-АГЕНТ (Сяо Мин · 小明)
   ============================================================ */
let tutorHistory = [];
let tutorContext = { mode: 'chat', step: 0, quiz: null };

function tutorAllVocab() {
  const list = [];
  const seen = new Set();
  const push = (w, src) => {
    if (!w || !w.h || seen.has(w.h + '|' + w.r)) return;
    seen.add(w.h + '|' + w.r);
    list.push({ h: w.h, p: w.p || '', r: w.r || '', lesson: src || '' });
  };
  Object.entries(LESSONS).forEach(([lid, l]) => l.vocab.forEach(w => push(w, l.title)));
  if (typeof PHRASES !== 'undefined') PHRASES.forEach(cat => (cat.items || []).forEach(w => push(w, cat.title)));
  if (typeof TEXTS !== 'undefined') TEXTS.forEach(t => (t.gloss || []).forEach(w => push(w, t.title)));
  if (typeof HANDWRITING !== 'undefined') HANDWRITING.forEach(w => push(w, 'Пропись'));
  [
    { h: '茶', p: 'chá', r: 'чай' },
    { h: '绿茶', p: 'lǜchá', r: 'зелёный чай' },
    { h: '爱', p: 'ài', r: 'любить' },
    { h: '中文', p: 'Zhōngwén', r: 'китайский язык' },
    { h: '汉语', p: 'Hànyǔ', r: 'китайский язык (путунхуа)' },
    { h: '加油', p: 'jiāyóu', r: 'не сдавайся! вперёд!' },
    { h: '老师', p: 'lǎoshī', r: 'учитель' },
    { h: '同学', p: 'tóngxué', r: 'одноклассник; ученик' }
  ].forEach(w => push(w, 'Базовый словарь'));
  return list;
}

function tutorReplyLocal(raw) {
  const q = (raw || '').trim();
  const low = q.toLowerCase();
  const vocab = tutorAllVocab();

  /* 1) Совет по личному прогрессу */
  if (/прогресс|повторить|совет|что учить|план|ошибк/.test(low)) {
    const done = doneCount(), total = allLessonIds().length;
    const due = dueCards().length;
    const nxt = LESSONS[nextLesson()];
    const hard = cardPool().filter(c => state.cards[c.h]?.wrong > 0).slice(0, 4);
    let txt = `Ваш прогресс: пройдено <b>${done} из ${total}</b> уроков, точность <b>${accuracy()}%</b>, серия <b>${state.streak}</b> дн.<br><br>`;
    if (due) txt += `🗂️ У вас <b>${due}</b> карточек ждут повторения — загляните в <a href="#/cards">Карточки</a>.<br>`;
    if (hard.length) txt += `🎯 Сложные слова: ${hard.map(c => `<b>${esc(c.h)}</b> (${esc(c.p)} — ${esc(c.r)})`).join(', ')}.<br>`;
    txt += `📚 Следующий рекомендуемый урок: <b>«${esc(nxt.title)}»</b> — <a href="#/lesson/${nextLesson()}">открыть урок →</a>`;
    return { html: txt };
  }

  /* 2) Мини-тест по китайскому прямо в чате */
  if (/тест|проверь|викторин|экзамен|задани/.test(low)) {
    const pool = vocab.filter(w => w.h && w.p && w.r);
    const target = pool[Math.floor(Math.random() * pool.length)];
    const decoys = shuffle(pool.filter(w => w.r !== target.r)).slice(0, 3);
    const opts = shuffle([target, ...decoys]);
    return {
      html: `Проверьте себя! Как переводится слово <b class="zh" style="font-size:22px">${esc(target.h)}</b> <span style="color:var(--gold)">(${esc(target.p)})</span>?`,
      speak: target.h,
      quiz: { target, opts }
    };
  }

  /* 3) Интерактивный мини-диалог */
  if (/диалог|поговор|практик|общен|привет/.test(low) && !/[\u4e00-\u9fff]/.test(q)) {
    tutorContext.mode = 'dialogue';
    tutorContext.step = 1;
    return {
      html: `Отлично, потренируем живой диалог! Я начинаю:<br>
        <b class="zh" style="font-size:20px">你好！你叫什么名字？</b><br>
        <span style="color:var(--gold)">Nǐ hǎo! Nǐ jiào shénme míngzi?</span> — Привет! Как тебя зовут?<br>
        <i>Ответьте по-китайски (например: <code>我叫Али</code> или <code>你好</code>)</i>`,
      speak: '你好！你叫什么名字？'
    };
  }
  if (tutorContext.mode === 'dialogue' && /[\u4e00-\u9fff]|nihao|wo|jiao|xie|hao/i.test(low)) {
    if (tutorContext.step === 1) {
      tutorContext.step = 2;
      return {
        html: `Супер ответ! 👍 Продолжаем:<br>
          <b class="zh" style="font-size:20px">很高兴认识你！你喜欢喝茶还是咖啡？</b><br>
          <span style="color:var(--gold)">Hěn gāoxìng rènshi nǐ! Nǐ xǐhuan hē chá háishi kāfēi?</span> — Рад познакомиться! Ты любишь чай или кофе?`,
        speak: '很高兴认识你！你喜欢喝茶还是咖啡？'
      };
    }
    tutorContext.mode = 'chat';
    return {
      html: `Отлично звучит! 👏 Вы уверенно держите диалог.<br>
        <b class="zh" style="font-size:20px">你中文说得很好！继续加油！</b><br>
        <span style="color:var(--gold)">Nǐ Zhōngwén shuō de hěn hǎo! Jìxù jiāyóu!</span> — Вы хорошо говорите по-китайски! Так держать!`,
      speak: '你中文说得很好！继续加油！'
    };
  }

  /* 4) Объяснение грамматики */
  const grammarKB = [
    { re: /吗|\bma\b|вопрос/, title: 'Вопросительная частица 吗 (ma)',
      body: 'Ставится в самом конце утверждения, чтобы получился вопрос «да/нет».<br>Пример: <b class="zh">你喝茶吗？</b> (Nǐ hē chá ma?) — Ты пьёшь чай?', speak: '你喝茶吗' },
    { re: /不|没|отрицан/, title: 'Отрицание 不 (bù) и 没 (méi)',
      body: '<b>不 (bù)</b> — отрицание в настоящем/будущем или привычке (<b class="zh">我不喝咖啡</b> — Я не пью кофе).<br><b>没 (méi)</b> — отрицание в прошлом или с глаголом 有 (<b class="zh">我没有时间</b> — У меня нет времени; <b class="zh">我昨天没去</b> — Вчера я не ходил).', speak: '我不喝咖啡' },
    { re: /了|\ble\b|прошед/, title: 'Частица 了 (le)',
      body: 'Показывает завершённое действие или новое состояние.<br>Пример: <b class="zh">我买了茶</b> (Wǒ mǎi le chá) — Я купил чай. / <b class="zh">下雨了</b> — Пошёл дождь.', speak: '我买了茶' },
    { re: /的|\bde\b|притяж/, title: 'Частица 的 (de)',
      body: 'Связывает определение или владельца с предметом: «чей» или «какой».<br>Пример: <b class="zh">我的书</b> (wǒ de shū) — моя книга; <b class="zh">好喝的茶</b> — вкусный чай.', speak: '我的书' },
    { re: /把|\bba\b/, title: 'Конструкция 把 (bǎ)',
      body: 'Выносит объект перед глаголом, когда с предметом что-то сделали или переместили его.<br>Схема: Подлежащее + 把 + Объект + Глагол + Результат.<br>Пример: <b class="zh">请把门关上</b> — Пожалуйста, закрой дверь.', speak: '请把门关上' },
    { re: /тон|пиньинь|сандх|произнош/, title: 'Тоны и сандхи (изменение тонов)',
      body: '1) Два 3-х тона подряд читаются как 2-й + 3-й: <b class="zh">你好</b> (nǐ hǎo → ní hǎo).<br>2) <b>不 (bù)</b> перед 4-м тоном становится <b>bú</b>: <b class="zh">不是</b> (bú shì).<br>Загляните также в раздел <a href="#/tones">Тоны</a> и <a href="#/videos">Видео-уроки</a>.', speak: '你好，不是' },
    { re: /счетн|счётн|个|本|杯|классификатор/, title: 'Счётные слова (个, 本, 杯)',
      body: 'Между числом и предметом в китайском всегда ставится счётное слово:<br>• <b>个 (gè)</b> — универсальное (一个人 — один человек)<br>• <b>本 (běn)</b> — для книг (一本书)<br>• <b>杯 (bēi)</b> — чашка/стакан (一杯茶)', speak: '一杯茶' }
  ];
  for (const g of grammarKB) {
    if (g.re.test(low)) {
      return { html: `<b>📖 ${g.title}</b><br><br>${g.body}`, speak: g.speak };
    }
  }

  /* 5) Разбор китайских иероглифов / перевод из словаря курса */
  const clean = q.replace(/[？?！!。.,，\s]/g, '');
  const exact = vocab.find(w => w.h === clean || w.r.toLowerCase() === low || w.p.toLowerCase() === low);
  if (exact) {
    return {
      html: `<b class="zh" style="font-size:26px">${esc(exact.h)}</b> <span style="color:var(--gold)">[${esc(exact.p)}]</span><br>
        Перевод: <b>${esc(exact.r)}</b><br>
        <span style="color:var(--txt3);font-size:12.5px">Раздел курса: ${esc(exact.lesson || '')}</span>`,
      speak: exact.h
    };
  }

  /* Частичное совпадение по русски или по иероглифам */
  const hasHanzi = /[\u4e00-\u9fff]/.test(q);
  if (hasHanzi) {
    const chars = [...q.match(/[\u4e00-\u9fff]+/g).join('')];
    const parts = [];
    let i = 0;
    while (i < chars.length) {
      let found = null;
      for (let len = Math.min(4, chars.length - i); len >= 1; len--) {
        const sub = chars.slice(i, i + len).join('');
        const hit = vocab.find(w => w.h === sub);
        if (hit) { found = hit; i += len; break; }
      }
      if (found) parts.push(found);
      else { parts.push({ h: chars[i], p: '?', r: 'нет в базовом словаре курса' }); i++; }
    }
    return {
      html: `<b>🔍 Разбор фразы:</b><br><br>` +
        parts.map(w => `• <b class="zh" style="font-size:18px">${esc(w.h)}</b> <span style="color:var(--gold)">${esc(w.p)}</span> — ${esc(w.r)}`).join('<br>'),
      speak: chars.join('')
    };
  }

  const hits = vocab.filter(w =>
    w.r.toLowerCase().includes(low) || w.p.toLowerCase().replace(/[^a-z]/g, '').includes(low.replace(/[^a-z]/g, ''))
  ).slice(0, 6);
  if (hits.length) {
    return {
      html: `Вот что нашлось по запросу «${esc(q)}»:<br><br>` +
        hits.map(w => `• <b class="zh" style="font-size:18px">${esc(w.h)}</b> <span style="color:var(--gold)">${esc(w.p)}</span> — ${esc(w.r)}`).join('<br>'),
      speak: hits[0].h
    };
  }

  return {
    html: `Я ваш внутренний ИИ-репетитор <b>Сяо Мин (小明)</b>! Могу помочь с:<br>
      • <b>Переводом и разбором</b>: напишите любое слово по-русски или иероглифами (например: <i>чай</i>, <i>спасибо</i> или <i>我想喝茶</i>)<br>
      • <b>Грамматикой</b>: спросите про <i>吗, 不/没, 了, 的, 把, тоны, счётные слова</i><br>
      • <b>Практикой</b>: напишите <i>«диалог»</i> или <i>«проверь меня»</i>!`
  };
}

function renderTutor(root) {
  const wrap = el('div', 'tutor-wrap');
  wrap.appendChild(el('h1', 'page-title', '🤖 ИИ-репетитор Сяо Мин (小明)'));
  wrap.appendChild(el('p', 'page-sub', 'Внутренний помощник по китайскому языку: перевод, разбор иероглифов, грамматика, диалоги и мини-тесты.'));

  const chips = el('div', 't-chips');
  [
    ['🔍 Как сказать «спасибо»?', 'спасибо'],
    ['📖 Что такое частица 了?', 'объясни частицу 了'],
    ['🎵 Как меняются тоны?', 'объясни тоны и сандхи'],
    ['💬 Потренируем диалог', 'давай поговорим в диалоге'],
    ['🎯 Что мне повторить?', 'что мне повторить сейчас'],
    ['🎲 Проверь меня', 'проверь меня тестом']
  ].forEach(([label, query]) => {
    const b = el('button', 'btn btn-sm btn-ghost', label);
    b.onclick = () => sendMsg(query);
    chips.appendChild(b);
  });
  wrap.appendChild(chips);

  const box = el('div', 'panel tutor-box');
  const feed = el('div', 'tutor-feed');
  box.appendChild(feed);

  if (!tutorHistory.length) {
    tutorHistory.push({
      role: 'assistant',
      html: '你好! Я <b>Сяо Мин (小明)</b> — ваш персональный ИИ-помощник по китайскому. Спросите перевод, грамматику или выберите подсказку выше!',
      speak: '你好！我是小明。'
    });
  }

  function paintFeed() {
    feed.innerHTML = '';
    tutorHistory.forEach(m => {
      const row = el('div', 't-msg ' + (m.role === 'user' ? 't-user' : 't-bot'));
      const bubble = el('div', 't-bubble', m.html || esc(m.content || ''));
      if (m.speak) {
        const sp = el('div', 't-sp', `${toneBtn(m.speak, 'speak sm')} <span>прослушать</span>`);
        bubble.appendChild(sp);
      }
      if (m.quiz) {
        const qz = el('div', 't-quiz');
        m.quiz.opts.forEach(opt => {
          const ob = el('button', 'btn btn-sm btn-ghost', opt.r);
          ob.onclick = () => {
            if (qz.dataset.done) return;
            qz.dataset.done = '1';
            const ok = opt.h === m.quiz.target.h;
            ob.classList.remove('btn-ghost');
            ob.classList.add(ok ? 'btn-primary' : 'btn-danger');
            playSfx(ok ? 'ok' : 'bad');
            toast(ok ? 'Верно! 🎉' : `Правильно: ${m.quiz.target.r}`);
          };
          qz.appendChild(ob);
        });
        bubble.appendChild(qz);
      }
      row.appendChild(bubble);
      feed.appendChild(row);
    });
    feed.scrollTop = feed.scrollHeight;
  }

  const form = el('form', 'tutor-form');
  const inp = el('input', 't-input');
  inp.placeholder = 'Напишите вопрос, русское слово или иероглиф…';
  const send = el('button', 'btn btn-primary', 'Отправить →');
  send.type = 'submit';
  form.appendChild(inp); form.appendChild(send);
  box.appendChild(form);
  wrap.appendChild(box);
  root.appendChild(wrap);

  async function sendMsg(text) {
    const q = (text || '').trim();
    if (!q) return;
    tutorHistory.push({ role: 'user', content: q });
    paintFeed();
    send.disabled = true;

    let replyObj = null;
    if (window.Auth && Auth.online) {
      try {
        const res = await fetch('/api/tutor/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: q,
            history: tutorHistory.slice(-6).map(x => ({ role: x.role, content: x.content || '' })),
            context: `Пройдено уроков: ${doneCount()}/15, точность: ${accuracy()}%`
          })
        });
        const d = await res.json();
        if (d && d.mode === 'ai' && d.reply) {
          replyObj = { html: esc(d.reply).replace(/\n/g, '<br>') };
        }
      } catch (e) { }
    }
    if (!replyObj) replyObj = tutorReplyLocal(q);
    tutorHistory.push({ role: 'assistant', content: q, ...replyObj });
    send.disabled = false;
    paintFeed();
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const val = inp.value;
    inp.value = '';
    sendMsg(val);
  };
  paintFeed();
}

/* ---------- Профиль ---------- */
function renderAccount(root) {
  const wrap = el('div');
  const u = Auth.user;
  wrap.appendChild(el('h1', 'page-title', '👤 Профиль'));
  const p = el('div', 'panel');
  if (u) {
    p.appendChild(el('div', 'profile-head', `
      <div class="avatar">${esc(u.display_name.slice(0, 1).toUpperCase())}</div>
      <div>
        <h3 style="margin:0">${esc(u.display_name)}</h3>
        <div class="profile-role">${esc(Auth.ROLE_RU[u.role] || u.role)} · логин <b>@${esc(u.username)}</b></div>
      </div>`));
    const rows = el('div', 'profile-rows');
    rows.appendChild(el('div', 'pr-row', `<span>Статус сервера</span><b class="ok">${Auth.online ? 'подключено ✓' : 'нет соединения'}</b>`));
    rows.appendChild(el('div', 'pr-row', `<span>Прогресс на сервере</span><b>${Auth.user ? 'синхронизируется автоматически' : '—'}</b>`));
    rows.appendChild(el('div', 'pr-row', `<span>Режим</span><b>${window.__guest ? 'локальный (без аккаунта)' : 'аккаунт подключён'}</b>`));
    p.appendChild(rows);
    const btnRow = el('div', 'btn-row');
    const sync = el('button', 'btn btn-primary', '⇅ Синхронизировать сейчас');
    sync.onclick = () => { Auth.persist(true); toast('Отправлено на сервер'); };
    const out = el('button', 'btn btn-ghost', '🚪 Выйти из аккаунта');
    out.onclick = async () => { await Auth.logout(); window.__guest = false; paintAccountFoot(); updateNavRoles(); location.hash = '#/home'; route(); };
    btnRow.appendChild(sync); btnRow.appendChild(out);
    p.appendChild(btnRow);
  } else {
    const isFilePreview = (location.protocol !== 'http:' && location.protocol !== 'https:');
    p.appendChild(el('div', 'empty', isFilePreview
      ? 'Открыт автономный просмотр файла (без сервера). Чтобы войти в аккаунт или управлять классом, откройте Live Preview на порту 8080.'
      : 'Вы не вошли в аккаунт. Прогресс хранится только в этом браузере.'));
    const btn = el('button', 'btn btn-primary', '🔑 Войти или зарегистрироваться');
    btn.onclick = () => { window.__showAuth(); };
    p.appendChild(btn);
  }
  wrap.appendChild(p);

  /* Смена пароля. Без неё забытый пароль означал бы потерю аккаунта:
     ученик не мог бы войти, а учитель — помочь. */
  if (u) {
    const pw = el('div', 'panel');
    pw.appendChild(el('h3', '', '🔑 Пароль'));
    pw.appendChild(el('p', 'pw-note', 'Минимум 8 символов. После смены остальные устройства выйдут из аккаунта.'));
    const pform = el('div', 'pw-form');
    const curInp = el('input', 'gap-input');
    const newInp = el('input', 'gap-input');
    const repInp = el('input', 'gap-input');
    [[curInp, 'Текущий пароль', 'current-password'],
     [newInp, 'Новый пароль (мин. 8)', 'new-password'],
     [repInp, 'Повторите новый', 'new-password']].forEach(([inp, ph, ac]) => {
      inp.type = 'password'; inp.placeholder = ph; inp.autocomplete = ac;
      inp.setAttribute('aria-label', ph);
    });
    const go = el('button', 'btn btn-primary', 'Сменить');
    go.onclick = async () => {
      if (newInp.value.length < 8) return toast('Новый пароль — минимум 8 символов');
      if (newInp.value !== repInp.value) return toast('Новые пароли не совпадают');
      if (!curInp.value) return toast('Введите текущий пароль');
      go.disabled = true;
      const label = go.textContent;
      go.textContent = 'Меняем…';
      try {
        await Auth.changePassword(curInp.value, newInp.value);
        curInp.value = newInp.value = repInp.value = '';
        toast('Пароль изменён ✓');
      } catch (e) {
        toast(e.message === 'bad_password' ? 'Текущий пароль указан неверно'
          : e.message === 'weak_password' ? 'Пароль короче 8 символов'
          : 'Не удалось сменить пароль');
      } finally {
        go.disabled = false;
        go.textContent = label;
      }
    };
    pform.append(curInp, newInp, repInp, go);
    pw.appendChild(pform);
    wrap.appendChild(pw);
  }

  if (u && Auth.grade && (Auth.grade.grade || Auth.grade.comment)) {
    const gp = el('div', 'panel grade-panel');
    gp.appendChild(el('h3', '', '🎓 Оценка и отзыв учителя'));
    gp.appendChild(el('div', 'grade-box', `
      ${Auth.grade.grade ? `<div class="grade-num">${esc(Auth.grade.grade)}</div>` : ''}
      <div>${Auth.grade.comment ? esc(Auth.grade.comment) : 'Комментарий пока не добавлен'}</div>`));
    wrap.appendChild(gp);
  }

  /* настройки обучения (работают и на телефоне, и на компьютере) */
  const prefsPanel = el('div', 'panel');
  prefsPanel.appendChild(el('h3', '', '⚙️ Настройки обучения'));
  const pr = el('div', 'btn-row');
  const bSpd = el('button', 'btn btn-ghost', PREFS.slow ? '🐢 Озвучка: медленно (0.7×)' : '🐇 Озвучка: обычно (1.0×)');
  bSpd.onclick = () => { PREFS.slow = !PREFS.slow; paintAccountFoot(); route(); };
  const bThm = el('button', 'btn btn-ghost', PREFS.theme === 'light' ? '☀️ Тема: светлая (бумага)' : '🌙 Тема: тёмная');
  bThm.onclick = () => { PREFS.theme = PREFS.theme === 'light' ? 'dark' : 'light'; paintAccountFoot(); route(); };
  const bSfx = el('button', 'btn btn-ghost', PREFS.sfx ? '🔔 Звуки эффектов: вкл' : '🔇 Звуки эффектов: выкл');
  bSfx.onclick = () => { PREFS.sfx = !PREFS.sfx; route(); };
  pr.appendChild(bSpd); pr.appendChild(bThm); pr.appendChild(bSfx);
  prefsPanel.appendChild(pr);
  wrap.appendChild(prefsPanel);

  if (Auth.user && (Auth.user.role === 'owner' || Auth.user.role === 'teacher')) {
    const c = el('div', 'panel');
    c.appendChild(el('h3', '', '👨‍🏫 Учительские инструменты'));
    c.appendChild(el('p', 'page-sub', 'Панель класса: сводка по ученикам, выставление оценок, коды-приглашения, экспорт в CSV.'));
    const b = el('a', 'btn btn-primary', 'Открыть панель класса →');
    b.href = '#/class';
    c.appendChild(b);
    wrap.appendChild(c);
  }
  root.appendChild(wrap);
}

/* Сессия истекла: показываем это явно и уводим на экран входа,
   вместо прежнего «тихого» отказа сохранений. */
window.addEventListener('auth:expired', () => {
  window.__guest = false;
  toast('Сессия истекла — войдите снова. Прогресс в браузере сохранён.');
  paintAccountFoot();
  updateNavRoles();
  route();
});

document.addEventListener('DOMContentLoaded', boot);
async function boot() {
  initNav();
  touchDay();
  if (window.Auth) { try { await Auth.boot(); } catch (e) { } }
  maybeFrameBanner();
  paintAccountFoot();
  updateNavRoles();
  route();
  setInterval(touchDay, 60000);
}

/* Если открыт просмотр файла без сервера или iframe с заблокированным localStorage —
   подсказываем пользователю, как войти и сохранить прогресс. */
function maybeFrameBanner() {
  const isFilePreview = (location.protocol !== 'http:' && location.protocol !== 'https:');
  if (isFilePreview) {
    const b = el('div', 'frame-banner');
    b.innerHTML = `<span>📌 Вы открыли просмотр файла <b>index.html</b> (без сети). Чтобы войти в аккаунт и открыть панель класса, переключитесь на панель <b>Live Preview («Chinese Learning App»)</b>.</span>`;
    const close = el('button', 'fb-x', '✕');
    close.onclick = () => b.remove();
    b.appendChild(close);
    document.body.prepend(b);
    return;
  }
  if (!Store.persistent && !(window.Auth && Auth.user)) {
    const b = el('div', 'frame-banner');
    b.innerHTML = `<span>📌 Войдите в аккаунт, чтобы ваш прогресс сохранялся на сервере между сеансами.</span>`;
    const btn = el('button', 'btn btn-sm btn-primary', 'Войти / Регистрация');
    btn.onclick = () => { if (window.__showAuth) window.__showAuth(); b.remove(); };
    b.appendChild(btn);
    const close = el('button', 'fb-x', '✕');
    close.onclick = () => b.remove();
    b.appendChild(close);
    document.body.prepend(b);
  }
}

</script>
</body>
</html>
