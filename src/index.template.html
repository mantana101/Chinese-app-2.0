<body>
<!-- «Ручные» фильтры. Неровности в SVG рисуются смещением шума: линия
     перестаёт быть математически ровной и выглядит нарисованной от руки.
     scale можно менять из CSS через --rough-* переменные. -->
<svg class="rough-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough-line" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="4" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>

<script>
/* Устанавливаем приложение на телефон и открываем его без сети.
   Всё нужное уже внутри страницы, поэтому офлайн работает честно. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    if (window.__swDone) return;
    window.__swDone = true;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
